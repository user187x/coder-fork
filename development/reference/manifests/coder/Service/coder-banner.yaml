apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/tracking-id: coder-banner:/Service:coder/coder-banner
  labels:
    app.kubernetes.io/instance: coder-banner
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: coder-banner
    app.kubernetes.io/part-of: coder
  name: coder-banner
  namespace: coder
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  - name: live
    port: 8081
    protocol: TCP
    targetPort: live
  selector:
    app.kubernetes.io/instance: coder-banner
    app.kubernetes.io/name: coder-banner
  sessionAffinity: None
  type: ClusterIP
