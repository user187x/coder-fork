apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '2'
    argocd.argoproj.io/tracking-id: coder-banner:gateway.networking.k8s.io/HTTPRoute:coder/coder-banner
  labels:
    app.kubernetes.io/instance: coder-banner
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: coder-banner
    app.kubernetes.io/part-of: coder
  name: coder-banner
  namespace: coder
spec:
  hostnames:
  - coder.grey-marshall.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: coder-banner
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /__banner
  - backendRefs:
    - group: ''
      kind: Service
      name: coder-banner
      port: 8081
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /__banner/live
  - backendRefs:
    - group: ''
      kind: Service
      name: coder
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /@
  - backendRefs:
    - group: ''
      kind: Service
      name: coder
      port: 80
      weight: 1
    filters:
    - extensionRef:
        group: traefik.io
        kind: Middleware
        name: coder-banner-menu
      type: ExtensionRef
    matches:
    - path:
        type: RegularExpression
        value: ^/assets/index-[A-Za-z0-9_-]+\.js$
  - backendRefs:
    - group: ''
      kind: Service
      name: coder
      port: 80
      weight: 1
    filters:
    - extensionRef:
        group: traefik.io
        kind: Middleware
        name: coder-banner
      type: ExtensionRef
    matches:
    - headers:
      - name: Accept
        type: RegularExpression
        value: .*text/html.*
      path:
        type: PathPrefix
        value: /
