  admin.html: "<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <meta name=\"robots\" content=\"noindex\"\
    >\n  <title>Announcement banner \xB7 Coder admin</title>\n  <link rel=\"stylesheet\" href=\"/__banner/admin/app.css\">\n</head>\n<body>\n  <header class=\"topbar\">\n    <div class=\"topbar-inner\"\
    >\n      <h1>Announcement banner</h1>\n      <div class=\"who\"><a href=\"/\">\u2190 Back to Coder</a><span id=\"who\"></span></div>\n    </div>\n  </header>\n\n  <main class=\"page\">\n    <section\
    \ class=\"card\" aria-labelledby=\"preview-h\">\n      <div class=\"card-head\">\n        <h2 id=\"preview-h\">What developers see</h2>\n        <span id=\"status\" class=\"pill\" role=\"status\">Loading\u2026\
    </span>\n      </div>\n      <div class=\"preview-frame\"><div id=\"preview\"></div></div>\n      <p class=\"hint\" id=\"preview-note\">Live preview of your draft below. Nothing is published until you\
    \ press <b>Publish changes</b>.</p>\n    </section>\n\n    <section class=\"card\" aria-labelledby=\"edit-h\">\n      <div class=\"card-head\"><h2 id=\"edit-h\">Message</h2></div>\n\n      <div class=\"\
    chips\" role=\"group\" aria-label=\"Start from a template\">\n        <span class=\"chips-label\">Start from:</span>\n        <button type=\"button\" class=\"chip\" data-preset=\"maintenance\">Scheduled\
    \ maintenance</button>\n        <button type=\"button\" class=\"chip chip-danger\" data-preset=\"emergency\">Emergency patch</button>\n        <button type=\"button\" class=\"chip\" data-preset=\"clear\"\
    >All clear</button>\n      </div>\n\n      <label class=\"field\">\n        <span class=\"label\">Message <span class=\"count\" id=\"count\"></span></span>\n        <textarea id=\"message\" rows=\"\
    3\" maxlength=\"400\" placeholder=\"What do developers need to know?\"></textarea>\n      </label>\n\n      <fieldset class=\"field\">\n        <legend class=\"label\">Style</legend>\n        <div class=\"\
    levels\" id=\"levels\">\n          <label class=\"level level-info\"><input type=\"radio\" name=\"level\" value=\"info\"><span>Info</span></label>\n          <label class=\"level level-success\"><input\
    \ type=\"radio\" name=\"level\" value=\"success\"><span>Success</span></label>\n          <label class=\"level level-warning\"><input type=\"radio\" name=\"level\" value=\"warning\"><span>Warning</span></label>\n\
    \          <label class=\"level level-critical\"><input type=\"radio\" name=\"level\" value=\"critical\"><span>Critical</span></label>\n        </div>\n      </fieldset>\n\n      <fieldset class=\"\
    field\">\n        <legend class=\"label\">Text effect</legend>\n        <div class=\"effect-row\">\n          <select id=\"effect\" aria-describedby=\"effect-hint\">\n            <option value=\"none\"\
    \ data-hint=\"Plain text, no animation.\">None</option>\n            <option value=\"typewriter\" data-hint=\"Letters appear one by one, as if typed.\">Typewriter</option>\n            <option value=\"\
    fade\" data-hint=\"Words fade in one after another.\">Fade in</option>\n            <option value=\"rise\" data-hint=\"Letters slide up into place.\">Rise</option>\n            <option value=\"wave\"\
    \ data-hint=\"A wave of movement runs through the letters.\">Wave</option>\n            <option value=\"bounce\" data-hint=\"Letters drop in and bounce.\">Bounce</option>\n            <option value=\"\
    flip\" data-hint=\"Letters flip into view.\">Flip</option>\n            <option value=\"shake\" data-hint=\"The whole message shakes: best kept for urgent notices.\">Shake</option>\n            <option\
    \ value=\"pulse\" data-hint=\"The message gently pulses.\">Pulse</option>\n            <option value=\"rainbow\" data-hint=\"Colours sweep through the letters.\">Rainbow</option>\n          </select>\n\
    \          <label class=\"check\"><input id=\"repeat\" type=\"checkbox\"><span>Repeat continuously <small>(otherwise it plays once when the banner appears)</small></span></label>\n          <button\
    \ type=\"button\" id=\"replay\" class=\"btn\">\u25B6 Replay</button>\n        </div>\n        <p class=\"hint\" id=\"effect-hint\"></p>\n      </fieldset>\n\n      <div class=\"grid\">\n        <div\
    \ class=\"field lead-field\">\n          <label class=\"label\" for=\"title\">Bold lead-in <em>(optional)</em></label>\n          <div class=\"lead-row\">\n            <button type=\"button\" id=\"\
    emoji-btn\" class=\"btn emoji-btn\" aria-haspopup=\"dialog\" aria-expanded=\"false\" aria-controls=\"emoji-pop\" aria-label=\"Insert an emoji\" title=\"Insert an emoji\">\U0001F600</button>\n      \
    \      <input id=\"title\" type=\"text\" maxlength=\"80\" placeholder=\"e.g. Security patch:\">\n          </div>\n          <div id=\"emoji-pop\" class=\"emoji-pop\" role=\"dialog\" aria-label=\"Insert\
    \ an emoji\" hidden></div>\n        </div>\n        <label class=\"field\"><span class=\"label\">Link text <em>(optional)</em></span>\n          <input id=\"linkText\" type=\"text\" maxlength=\"60\"\
    \ placeholder=\"e.g. Status page\"></label>\n        <label class=\"field grid-wide\"><span class=\"label\">Link address <em>(optional)</em></span>\n          <input id=\"linkUrl\" type=\"text\" maxlength=\"\
    500\" placeholder=\"https://\u2026\"></label>\n      </div>\n\n      <div class=\"options\">\n        <label class=\"check\"><input id=\"dismissible\" type=\"checkbox\"><span>Let people dismiss it <small>(untick\
    \ for urgent notices)</small></span></label>\n        <label class=\"check\"><input id=\"showOnLoginPage\" type=\"checkbox\"><span>Also show on the sign-in page</span></label>\n      </div>\n\n    \
    \  <details class=\"advanced\">\n        <summary>Advanced</summary>\n        <label class=\"field inline\"><span class=\"label\">Open tabs check for changes every</span>\n          <input id=\"refreshSeconds\"\
    \ type=\"number\" min=\"15\" max=\"3600\" step=\"5\"> <span>seconds</span></label>\n        <p class=\"hint\">Lower is faster to reach people who already have Coder open (minimum 15).</p>\n      </details>\n\
    \n      <div id=\"problem\" class=\"problem\" role=\"alert\" hidden></div>\n\n      <div class=\"actions\">\n        <button type=\"button\" id=\"publish\" class=\"btn btn-primary\" disabled>Publish\
    \ changes</button>\n        <button type=\"button\" id=\"revert\" class=\"btn\" disabled>Discard edits</button>\n        <span class=\"spacer\"></span>\n        <button type=\"button\" id=\"toggle\"\
    \ class=\"btn\">Hide banner</button>\n      </div>\n      <p class=\"hint\" id=\"dirty\" aria-live=\"polite\"></p>\n    </section>\n\n    <section class=\"card card-emergency\" aria-labelledby=\"emergency-h\"\
    >\n      <div class=\"card-head\"><h2 id=\"emergency-h\">Emergency: show it again</h2></div>\n      <p>People who dismissed the banner will not see it again on their own. Use this when something urgent\
    \ needs everyone's attention, for example a zero-day patch, so they can save their work.</p>\n      <div class=\"actions\">\n        <button type=\"button\" id=\"reappear\" class=\"btn btn-danger\"\
    >Show again to everyone</button>\n      </div>\n      <p class=\"hint\" id=\"reappear-note\"></p>\n    </section>\n\n    <section class=\"meta\">\n      <p id=\"meta\"></p>\n      <p><button type=\"\
    button\" id=\"reset\" class=\"link\" hidden>Discard everything published here and use the chart defaults</button></p>\n    </section>\n  </main>\n\n  <div id=\"toast\" class=\"toast\" role=\"status\"\
    \ aria-live=\"polite\" hidden></div>\n\n  <script src=\"/__banner/banner.js\" data-preview></script>\n  <script src=\"/__banner/admin/emoji-picker.js\"></script>\n  <script src=\"/__banner/admin/app.js\"\
    ></script>\n</body>\n</html>\n"
  app.css: ":root {\n  --bg: #f5f6f8; --card: #ffffff; --text: #1a1d23; --muted: #5b6472; --border: #d8dce3;\n  --primary: #1e40af; --primary-text: #ffffff; --danger: #b91c1c; --focus: #2563eb;\n  --ok:\
    \ #166534; --off: #6b7280;\n}\n@media (prefers-color-scheme: dark) {\n  :root { --bg: #0e1116; --card: #171b22; --text: #e8eaee; --muted: #9aa3b2; --border: #2b323d;\n          --primary: #3b6fe0; --danger:\
    \ #dc4b4b; --focus: #6ea0ff; --ok: #4ade80; --off: #8b93a1; }\n}\n* { box-sizing: border-box; }\nbody { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system,\
    \ \"Segoe UI\", Roboto, sans-serif; }\n.topbar { background: var(--card); border-bottom: 1px solid var(--border); }\n.topbar-inner { max-width: 860px; margin: 0 auto; padding: 14px 20px; display: flex;\
    \ align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }\nh1 { font-size: 18px; margin: 0; }\nh2 { font-size: 15px; margin: 0; }\n.who { color: var(--muted); font-size: 13px;\
    \ display: flex; gap: 14px; align-items: center; }\n.who a { color: inherit; }\n.page { max-width: 860px; margin: 0 auto; padding: 20px; display: grid; gap: 16px; }\n.card { background: var(--card);\
    \ border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }\n.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }\n.card-emergency\
    \ { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }\n.card-emergency h2 { color: var(--danger); }\n.card-emergency p { margin: 0 0 12px; }\n.pill { font-size: 12px; font-weight:\
    \ 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }\n.pill.live { color: var(--ok); border-color: currentColor; }\n.pill.off { color: var(--off);\
    \ }\n.preview-frame { border: 1px dashed var(--border); border-radius: 8px; overflow: hidden; background: var(--bg); min-height: 44px; }\n.preview-empty { padding: 12px 20px; color: var(--muted); font-size:\
    \ 14px; text-align: center; }\n.hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; }\n.field { display: block; margin: 0 0 14px; border: 0; padding: 0; min-width: 0; }\n.label { display:\
    \ block; font-weight: 600; font-size: 13px; margin-bottom: 5px; }\n.label em { color: var(--muted); font-weight: 400; font-style: normal; }\n.count { float: right; color: var(--muted); font-weight:\
    \ 400; }\ntextarea, input[type=text], input[type=number] { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 7px; background: var(--card); color: var(--text); font: inherit;\
    \ }\ninput[type=number] { width: 90px; }\ntextarea { resize: vertical; }\n:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }\n.grid { display: grid; grid-template-columns: 1fr\
    \ 1fr; gap: 0 14px; }\n.grid-wide { grid-column: 1 / -1; }\n@media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }\n.levels { display: flex; gap: 8px; flex-wrap: wrap; }\n.level input {\
    \ position: absolute; opacity: 0; pointer-events: none; }\n.level span { display: inline-block; padding: 7px 16px; border-radius: 7px; border: 2px solid transparent; color: #fff; font-weight: 600; font-size:\
    \ 13px; cursor: pointer; opacity: .55; }\n.level input:checked + span { opacity: 1; border-color: var(--text); }\n.level input:focus-visible + span { outline: 2px solid var(--focus); outline-offset:\
    \ 2px; }\n.level-info span { background: #1e40af; } .level-success span { background: #166534; }\n.level-warning span { background: #b45309; } .level-critical span { background: #b91c1c; }\n.effect-row\
    \ { display: flex; gap: 12px 18px; align-items: center; flex-wrap: wrap; }\n.effect-row .btn { padding: 6px 14px; }\nselect { padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px;\
    \ background: var(--card); color: var(--text); font: inherit; }\n.lead-field { position: relative; }\n.lead-row { display: flex; gap: 8px; align-items: stretch; }\n.lead-row input { flex: 1; min-width:\
    \ 0; }\n.emoji-btn { padding: 4px 11px; font-size: 20px; line-height: 1.2; }\n.emoji-pop { position: absolute; left: 0; top: calc(100% + 4px); z-index: 30; width: min(392px, calc(100vw - 32px)); display:\
    \ flex; flex-direction: column;\n  background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 32px rgba(0,0,0,.35); padding: 10px; gap: 8px; max-height: 440px;\
    \ }\n.emoji-pop[hidden], .emoji-pop [hidden] { display: none !important; }  /* the flex/grid rules below must not defeat `hidden` */\n.emoji-top { display: grid; gap: 6px; }\n.emoji-search { width:\
    \ 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--card); color: var(--text); font: inherit; }\n.emoji-into { display: flex; gap: 12px; align-items: center;\
    \ flex-wrap: wrap; font-size: 13px; color: var(--muted); }\n.emoji-radio { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; color: var(--text); }\n.emoji-tabs { display: flex; gap:\
    \ 2px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }\n.emoji-tab { flex: 1; font: inherit; font-size: 17px; padding: 3px 0; border: 0; border-radius: 6px; background: transparent; cursor:\
    \ pointer; }\n.emoji-tab:hover, .emoji-tab:focus-visible { background: color-mix(in srgb, var(--primary) 20%, transparent); }\n.emoji-scroll { overflow-y: auto; min-height: 120px; flex: 1; position:\
    \ relative; scroll-behavior: auto; }\n.emoji-sec { margin: 0 0 6px; }\n.emoji-h { position: sticky; top: 0; z-index: 1; margin: 0; padding: 4px 2px; background: var(--card); color: var(--muted); font-size:\
    \ 12px; font-weight: 600; text-transform: none; }\n.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 2px; }\n.emoji, .emoji-tab, .emoji-btn { font-family:\
    \ \"Apple Color Emoji\", \"Segoe UI Emoji\", \"Noto Color Emoji\", \"Twemoji Mozilla\", \"Segoe UI Symbol\", sans-serif; }\n.emoji { font-size: 22px; line-height: 1; padding: 6px 0; border: 0; border-radius:\
    \ 6px; background: transparent; cursor: pointer; }\n.emoji:hover, .emoji:focus-visible { background: color-mix(in srgb, var(--primary) 25%, transparent); }\n.emoji-none { margin: 14px 4px; color: var(--muted);\
    \ font-size: 13px; }\n.emoji-foot { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 6px; min-height:\
    \ 26px; }\n.emoji-name { color: var(--text); }\n.emoji-keys { text-align: right; }\n.chips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }\n.chips-label { color:\
    \ var(--muted); font-size: 13px; }\n.chip { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor:\
    \ pointer; }\n.chip:hover { border-color: var(--primary); }\n.chip-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, var(--border)); }\n.options { display: grid; gap:\
    \ 8px; margin: 4px 0 12px; }\n.check { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; }\n.check small { color: var(--muted); }\n.check input { margin-top: 4px; }\n.advanced { margin:\
    \ 0 0 12px; }\n.advanced summary { cursor: pointer; color: var(--muted); font-size: 13px; }\n.field.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0 0; }\n.field.inline\
    \ .label { margin: 0; }\n.problem { border: 1px solid var(--danger); color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, var(--card)); border-radius: 7px; padding: 9px 12px; margin-bottom:\
    \ 12px; font-size: 14px; }\n.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }\n.spacer { flex: 1; }\n.btn { font: inherit; font-weight: 600; padding: 9px 16px; border-radius:\
    \ 7px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }\n.btn:hover:not(:disabled) { border-color: var(--text); }\n.btn:disabled { opacity: .45; cursor:\
    \ not-allowed; }\n.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }\n.btn-danger { background: var(--danger); border-color: var(--danger); color:\
    \ #fff; }\n.link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; font-size: 13px; }\n.meta { color: var(--muted); font-size:\
    \ 13px; }\n.meta p { margin: 4px 0; }\n.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 8px;\
    \ font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,.3); max-width: 90vw; }\n.toast.error { background: var(--danger); color: #fff; }\n"
  app.js: "/* Coder banner admin page. All text from the server is inserted with textContent. */\n(function () {\n  'use strict';\n\n  var API = '/__banner/api/';\n  var PRESETS = {\n    maintenance: {\n\
    \      level: 'warning', title: 'Scheduled maintenance:', dismissible: true,\n      message: 'Coder will be unavailable on [date] from [start] to [end] UTC. Please save your work and stop your workspaces\
    \ beforehand.',\n    },\n    emergency: {\n      level: 'critical', title: 'Emergency security patch:', dismissible: false,\n      message: 'Coder will restart at [time] UTC to apply a critical security\
    \ fix. Save your work and push any code you need to keep now.',\n    },\n    clear: {\n      level: 'success', title: 'All clear:', dismissible: true,\n      message: 'Maintenance is complete and Coder\
    \ is back to normal. Thanks for your patience.',\n    },\n  };\n  var TEXT_FIELDS = ['message', 'title', 'linkText', 'linkUrl'];\n  var BOOL_FIELDS = ['dismissible', 'showOnLoginPage', 'repeat'];\n\
    \  var PLAY_DELAY_MS = 600; // let typing settle before (re)playing the effect in the preview\n\n  var $ = function (id) { return document.getElementById(id); };\n  var server = null; // last state\
    \ from the service\n  var busy = false;\n  var toastTimer = null;\n  var previewEl = null;\n  var playTimer = null;\n\n  function api(path, body) {\n    var options = { credentials: 'same-origin', headers:\
    \ {} };\n    if (body !== undefined) {\n      options.method = 'POST';\n      options.headers = { 'Content-Type': 'application/json', 'X-Requested-With': 'coder-banner-admin' };\n      options.body\
    \ = JSON.stringify(body);\n    }\n    return fetch(API + path, options).then(function (res) {\n      return res.json().catch(function () { return {}; }).then(function (data) {\n        if (res.status\
    \ === 401) {\n          window.location.href = '/login?redirect=' + encodeURIComponent('/__banner/admin');\n          return new Promise(function () {});\n        }\n        if (!res.ok) throw new Error(data.error\
    \ || 'Request failed (HTTP ' + res.status + ')');\n        return data;\n      });\n    });\n  }\n\n  // ---- form <-> banner\n  function readForm() {\n    var out = { enabled: server ? server.banner.enabled\
    \ : true };\n    TEXT_FIELDS.forEach(function (k) { out[k] = $(k).value.trim(); });\n    BOOL_FIELDS.forEach(function (k) { out[k] = $(k).checked; });\n    var level = document.querySelector('input[name=level]:checked');\n\
    \    out.level = level ? level.value : 'info';\n    out.effect = $('effect').value;\n    out.refreshSeconds = parseInt($('refreshSeconds').value, 10) || 60;\n    return out;\n  }\n\n  function writeForm(b)\
    \ {\n    TEXT_FIELDS.forEach(function (k) { $(k).value = b[k] || ''; });\n    BOOL_FIELDS.forEach(function (k) { $(k).checked = !!b[k]; });\n    var radio = document.querySelector('input[name=level][value='\
    \ + (b.level || 'info') + ']');\n    if (radio) radio.checked = true;\n    $('effect').value = b.effect || 'none';\n    if (!$('effect').value) $('effect').value = 'none'; // an effect this page does\
    \ not know about\n    $('refreshSeconds').value = b.refreshSeconds || 60;\n  }\n\n  // A banner saved before effects existed has no effect fields: that means \"none\", not \"changed\".\n  var EFFECT_DEFAULTS\
    \ = { effect: 'none', repeat: false };\n\n  function sameAsServer(form) {\n    var s = server.banner;\n    return TEXT_FIELDS.concat(BOOL_FIELDS, ['level', 'effect', 'refreshSeconds']).every(function\
    \ (k) {\n      return form[k] === (s[k] === undefined && k in EFFECT_DEFAULTS ? EFFECT_DEFAULTS[k] : s[k]);\n    });\n  }\n\n  // ---- rendering\n  // The preview text is redrawn on every keystroke;\
    \ the effect is (re)played once typing settles.\n  function playPreview() {\n    window.clearTimeout(playTimer);\n    if (previewEl && previewEl.isConnected) window.__coderBannerPreview.play(previewEl,\
    \ readForm());\n  }\n\n  function renderEffectHint() {\n    var option = $('effect').selectedOptions[0];\n    var hint = option ? option.getAttribute('data-hint') : '';\n    if (window.__coderBannerPreview.reducedMotion())\
    \ hint += ' This device asks for reduced motion, so effects are not played here, or for anyone with that setting.';\n    $('effect-hint').textContent = hint;\n    $('repeat').disabled = $('effect').value\
    \ === 'none';\n    $('replay').disabled = $('effect').value === 'none' || !previewEl;\n  }\n\n  function renderPreview() {\n    var form = readForm();\n    var box = $('preview');\n    window.clearTimeout(playTimer);\n\
    \    window.__coderBannerPreview.stop();\n    previewEl = null;\n    box.textContent = '';\n    if (!form.message) {\n      var empty = document.createElement('div');\n      empty.className = 'preview-empty';\n\
    \      empty.textContent = 'Type a message to see a preview.';\n      box.appendChild(empty);\n    } else {\n      form.enabled = true;\n      previewEl = window.__coderBannerPreview.build(form);\n\
    \      box.appendChild(previewEl);\n      if (form.effect !== 'none') playTimer = window.setTimeout(playPreview, PLAY_DELAY_MS);\n    }\n    renderEffectHint();\n  }\n\n  // \"3 open tabs\" - how many\
    \ browsers are holding the live connection right now.\n  function tabsText(prefix, suffix) {\n    if (!server || typeof server.subscribers !== 'number') return '';\n    return prefix + server.subscribers\
    \ + ' open tab' + (server.subscribers === 1 ? '' : 's') + suffix;\n  }\n\n  function renderStatus() {\n    var pill = $('status');\n    var on = server.banner.enabled && !!server.banner.message;\n \
    \   pill.textContent = on ? '\u25CF Live for all developers' + tabsText(' \xB7 ', ' connected') : '\u25CB Hidden';\n    pill.className = 'pill ' + (on ? 'live' : 'off');\n    $('toggle').textContent\
    \ = on ? 'Hide banner' : 'Show banner';\n    $('reappear').disabled = !server.banner.message;\n  }\n\n  function renderState() {\n    var form = readForm();\n    var dirty = !sameAsServer(form);\n \
    \   $('count').textContent = $('message').value.length + ' / 400';\n    $('publish').disabled = busy || !dirty || !form.message;\n    $('revert').disabled = busy || !dirty;\n    $('toggle').disabled\
    \ = busy;\n    $('reappear').disabled = busy || !server.banner.message;\n    $('reset').hidden = !server.overrideActive;\n    var note = '';\n    if (dirty) note = 'You have unpublished changes.';\n\
    \    else if (/\\[[^\\]]+\\]/.test(form.message)) note = 'Replace the [bracketed] parts of the message before publishing.';\n    $('dirty').textContent = note;\n    renderPreview();\n  }\n\n  function\
    \ renderMeta() {\n    var meta = $('meta');\n    if (server.overrideActive && server.updatedBy) {\n      meta.textContent = 'Last published by ' + server.updatedBy + ' on ' + new Date(server.updatedAt).toLocaleString()\
    \ + '.';\n    } else if (server.overrideActive) {\n      meta.textContent = 'Published from this page.';\n    } else {\n      meta.textContent = 'Nothing has been published from this page yet, so the\
    \ chart defaults are showing.';\n    }\n    var secs = server.banner.refreshSeconds;\n    $('reappear-note').textContent = 'Tabs with a live connection' + tabsText(' (', ' right now)') + ' update instantly;\
    \ any other open tab within about ' + secs +\n      ' seconds; anyone who loads Coder afterwards sees it immediately.';\n  }\n\n  function apply(data, resetForm) {\n    server = data;\n    $('who').textContent\
