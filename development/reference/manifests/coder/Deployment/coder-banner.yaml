apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/tracking-id: coder-banner:apps/Deployment:coder/coder-banner
  labels:
    app.kubernetes.io/instance: coder-banner
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: coder-banner
    app.kubernetes.io/part-of: coder
  name: coder-banner
  namespace: coder
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: coder-banner
      app.kubernetes.io/name: coder-banner
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/app: e1657fe4c36180d5
      labels:
        app.kubernetes.io/instance: coder-banner
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: coder-banner
        app.kubernetes.io/part-of: coder
    spec:
      containers:
      - command:
        - python3
        - /app/server.py
        env:
        - name: PORT
          value: '8080'
        - name: APP_DIR
          value: /app
        - name: DEFAULTS_FILE
          value: /config/banner.json
        - name: VENDOR_DIR
          value: /vendor
        - name: EMOJI_DIR
          value: /emoji
        - name: STATE_CONFIGMAP
          value: coder-banner-state
        - name: CODER_URL
          value: http://coder.coder.svc.cluster.local:80
        - name: ADMIN_ROLES
          value: owner
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: LIVE_ENABLED
          value: 'true'
        - name: LIVE_PORT
          value: '8081'
        - name: LIVE_MAX_CLIENTS
          value: '5000'
        - name: LIVE_HEARTBEAT
          value: '20'
        image: harbor.grey-marshall.com/library/python:3.13-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: banner
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8081
          name: live
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app
          name: app
          readOnly: true
        - mountPath: /config
          name: defaults
          readOnly: true
        - mountPath: /vendor
          name: vendor
          readOnly: true
        - mountPath: /emoji
          name: emoji
          readOnly: true
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: coder-banner
      serviceAccountName: coder-banner
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: coder-banner-app
        name: app
      - configMap:
          defaultMode: 420
          name: coder-banner-content
        name: defaults
      - configMap:
          defaultMode: 420
          name: coder-banner-vendor
        name: vendor
      - configMap:
          defaultMode: 420
          name: coder-banner-emoji
        name: emoji
      - emptyDir: {}
        name: tmp
