apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/tracking-id: coder-banner:traefik.io/Middleware:coder/coder-banner-menu-rewrite
  labels:
    app.kubernetes.io/instance: coder-banner
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: coder-banner
    app.kubernetes.io/part-of: coder
  name: coder-banner-menu-rewrite
  namespace: coder
spec:
  plugin:
    rewrite-body:
      rewrites:
      - regex: \(\{user:(\w+),buildInfo:(\w+),profileExtra:(\w+),supportLinks:(\w+),onSignOut:(\w+)\}\)=>\{
        replacement: ({user:${1},buildInfo:${2},profileExtra:${3},supportLinks:${4},onSignOut:${5}})=>{let __bannerAdmin=(${1}.roles||[]).some(r=>["owner"].includes(r.name));
      - regex: (\w+)\((\w+),\{asChild:!0,children:(\w+)\(\w+,\{to:`/coder-cup`,children:\[.*?(\w+)\(`span`,\{children:`Codernauts`\}\)\]\}\)\}\)
        replacement: (typeof __bannerAdmin===`undefined`||__bannerAdmin)&&${1}(${2},{asChild:!0,children:${3}(`a`,{href:`/__banner/admin`,children:[${3}(`svg`,{viewBox:`0 0 24 24`,fill:`none`,stroke:`currentColor`,strokeWidth:`1.5`,strokeLinecap:`round`,strokeLinejoin:`round`,xmlns:`http://www.w3.org/2000/svg`,children:[${4}(`path`,{d:`m3
          11 18-5v12L3 14v-3z`}),${4}(`path`,{d:`M11.6 16.8a3 3 0 1 1-5.8-1.6`})]}),${4}(`span`,{children:`Banner`})]})})
