apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/tracking-id: coder-banner:traefik.io/Middleware:coder/coder-banner-inject
  labels:
    app.kubernetes.io/instance: coder-banner
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: coder-banner
    app.kubernetes.io/part-of: coder
  name: coder-banner-inject
  namespace: coder
spec:
  plugin:
    rewrite-body:
      rewrites:
      - regex: </head>
        replacement: <script src="/__banner/banner.js" defer></script></head>
