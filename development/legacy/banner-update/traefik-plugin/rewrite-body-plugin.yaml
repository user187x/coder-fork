# Enables the Traefik "rewrite-body" plugin (static config, so it cannot ship with a chart).
# Applied on top of the existing release values by ../../install-banner-chart:
#   helm upgrade traefik traefik/traefik -n traefik --reuse-values -f rewrite-body-plugin.yaml
# The key under `plugins` must match `plugin.name` in banner-chart/values.yaml.
experimental:
  plugins:
    rewrite-body:
      moduleName: github.com/traefik/plugin-rewritebody
      version: v0.3.1
