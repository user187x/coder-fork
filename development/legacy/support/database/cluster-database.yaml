---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: coder-db
  namespace: coder
spec:
  instances: 3
  storage:
    size: 20Gi
    storageClass: "standard"
  bootstrap:
    initdb:
      database: coder
      owner: coder
      # Recommended: Define a secret for the 'coder' user credentials
      # secret:
      #   name: coder-secret
  managed:
    roles:
      - name: coder
        ensure: present
        superuser: false
        createdb: true
        login: true
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: coder-db-object
  namespace: coder
spec:
  name: coder
  owner: coder
  cluster:
    name: coder-db
