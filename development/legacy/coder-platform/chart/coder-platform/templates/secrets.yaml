{{- /*
Secrets rendered only when their value is given here. Otherwise ./install creates them once from install.conf (or
you do), and the chart never touches them, so an Argo CD sync can't overwrite or prune them.
*/ -}}
{{- if .Values.tls.caPem }}
apiVersion: v1
kind: Secret
metadata:
  name: tls-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  ca.crt: |
    {{- .Values.tls.caPem | trim | nindent 4 }}
{{- end }}
{{- with (.Values.oidc.caPem | default .Values.tls.caPem) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloaking-coder-ca
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "cp.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  ca.crt: |
    {{- . | trim | nindent 4 }}
{{- end }}
{{- if and .Values.oidc.enabled .Values.oidc.clientSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloaking-coder-oidc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  client-secret: {{ .Values.oidc.clientSecret | quote }}
{{- end }}
{{- if and .Values.bootstrap.enabled .Values.bootstrap.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.bootstrap.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  username: {{ .Values.bootstrap.username | quote }}
  email: {{ .Values.bootstrap.email | default (printf "coder-admin@%s" (include "cp.domain" .)) | quote }}
  password: {{ .Values.bootstrap.password | quote }}
{{- end }}
