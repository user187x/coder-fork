{{- /*
The workspace template the bootstrap Job pushes (files/workspace/*.tf). @@...@@ markers are filled in from the values,
so the template always matches this installation (namespace, workspace image, CA Secret).
*/ -}}
{{- if and .Values.bootstrap.enabled .Values.workspaces.template.enabled }}
{{- $main := .Files.Get "files/workspace/main.tf" }}
{{- $main = $main | replace "@@WORKSPACE_NAMESPACE@@" (include "cp.workspaceNamespace" .) }}
{{- $main = $main | replace "@@WORKSPACE_IMAGE@@" (include "cp.image" (list . .Values.workspaces.template.image)) }}
{{- $main = $main | replace "@@CA_SECRET@@" "tls-ca" }}
{{- $main = $main | replace "@@IMAGE_PULL_SECRET@@" (first (concat .Values.global.imagePullSecrets (list "")) | toString) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-platform-template
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
data:
  main.tf: |
    {{- $main | nindent 4 }}
  certificates.tf: |
    {{- .Files.Get "files/workspace/certificates.tf" | nindent 4 }}
{{- end }}
