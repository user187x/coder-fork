{{- /*
The dashboard add-ons (coder-ui-updates). The manifests are the same files the standalone
../../coder-ui-updates/coder-ui-updates script applies (copied to files/ui/ by ../../sync-sources); their @@PLACEHOLDERS@@
are filled in here from the values instead of from the running cluster. Differences from the script:
  - Coder's settings are this chart's values, so the Keycloak view doesn't edit an Argo CD Application (ARGOCD_APP
    empty: it checks and reports, and repairs Keycloak's side and the Secrets Coder reads)
  - Keycloak discovery (operator resource + admin Secret) only when oidc.keycloakNamespace is set
  - the default logo / avatar ConfigMaps (coder-ui-updates-default-*) are not rendered here: the installer makes them
    from the bundle's defaults/ (Helm's release record, 1 MiB, holds the whole chart and couldn't take an animated GIF);
    the service mounts them when they exist
*/ -}}
{{- if .Values.uiUpdates.enabled }}
{{- $u := .Values.uiUpdates }}
{{- $ns := .Release.Namespace }}
{{- $bannerOn := index .Values "coder-banner" "enabled" }}
{{- $static := list }}
{{- $sum := "" }}
{{- range $path, $_ := .Files.Glob "files/ui/*" }}
{{- $f := base $path }}
{{- if not (or (hasSuffix ".py" $f) (hasSuffix ".yaml" $f)) }}{{ $static = append $static $f }}{{ end }}
{{- if not (hasSuffix ".yaml" $f) }}{{ $sum = printf "%s%s" $sum ($.Files.Get $path | sha256sum) }}{{ end }}
{{- end }}
{{- $items := list }}
{{- range $static }}{{ $items = append $items (printf "              - {key: %s, path: %s}" . .) }}{{ end }}
{{- $hidden := list }}
{{- range $u.hideSupportLinks }}{{ $hidden = append $hidden (lower (trim .)) }}{{ end }}
{{- $kcNs := .Values.oidc.keycloakNamespace | default "" }}
{{- $certSecrets := list "tls-ca" }}
{{- range (.Values.coder.coder.volumes | default list) }}{{ with .secret }}{{ $certSecrets = append $certSecrets .secretName }}{{ end }}{{ end }}
{{- $quoted := list }}{{ range ($certSecrets | uniq) }}{{ $quoted = append $quoted (quote .) }}{{ end }}
{{- $fill := dict
  "@@NAMESPACE@@" $ns
  "@@LABELS@@" (printf "{app.kubernetes.io/name: coder-ui-updates, app.kubernetes.io/part-of: coder, app.kubernetes.io/managed-by: %s, app.kubernetes.io/instance: %s}" .Release.Service .Release.Name)
  "@@PLUGIN@@" .Values.traefik.pluginName
  "@@HIDDEN_LINKS@@" (toJson $hidden)
  "@@VIEW_PATH@@" $u.viewPath
  "@@VIEW_LABEL@@" $u.viewLabel
  "@@HOST@@" (include "cp.coderHost" .)
  "@@GATEWAY_NAME@@" .Values.gateway.name
  "@@GATEWAY_NAMESPACE@@" .Values.gateway.namespace
  "@@CODER_SERVICE@@" (include "cp.coderService" .)
  "@@CODER_PORT@@" "80"
  "@@IMAGE@@" (include "cp.image" (list . $u.image))
  "@@CHECKSUM@@" ($sum | sha256sum | trunc 16)
  "@@BANNER_URL@@" (ternary (printf "http://coder-banner.%s.svc.cluster.local:80" $ns) "" $bannerOn)
  "@@ADMIN_ROLES@@" (join "," $u.adminRoles)
  "@@CODER_URL@@" (include "cp.accessURL" .)
  "@@KEYCLOAK_NAMESPACE@@" $kcNs
  "@@KEYCLOAK_ADMIN_SECRET@@" "keycloak-initial-admin"
  "@@ARGOCD_NAMESPACE@@" "argocd"
  "@@ARGOCD_APP@@" ""
  "@@CA_SOURCE_SECRET@@" "tls-ca"
  "@@WORKSPACE_NAMESPACE@@" (include "cp.workspaceNamespace" .)
  "@@CODER_DB_SECRET@@" ($u.coderDB.secretName | default (printf "%s-app" .Values.postgres.name))
  "@@CODER_DB_SECRET_KEY@@" ($u.coderDB.secretKey | default "uri")
  "@@ATTACHED@@" (ternary "true" "false" .Values.attach.enabled)
  "@@OIDC_SECRET_NAME@@" ($u.oidcSecretName | default "keycloaking-coder-oidc")
  "@@CODER_CERT_SECRETS@@" (join ", " $quoted)
  "@@CODER_DB_CA_SECRET@@" ($u.coderDB.caSecretName | default (printf "%s-ca" .Values.postgres.name))
  "@@LOGS_DB_IMAGE@@" (include "cp.image" (list . ($u.logsDB.image | default .Values.postgres.image)))
  "@@STATIC_ITEMS@@" (join "\n" $items)
  "@@STORAGE_CLASS@@" (ternary (printf "  storageClassName: %s" .Values.global.storageClass) "" (ne .Values.global.storageClass ""))
  "@@SECTION_NAME@@" (ternary (printf "      sectionName: %q" .Values.gateway.sectionName) "" (ne .Values.gateway.sectionName ""))
  "@@BANNER_LOADER@@" (ternary "        - regex: '</head>'\n          replacement: '<script src=\"/__banner/banner.js\" defer></script></head>'" "" $bannerOn)
}}
{{- $pull := "" }}
{{- with .Values.global.imagePullSecrets }}
{{- $pull = printf "      imagePullSecrets: %s\n" (toJson (list)) }}
{{- $names := list }}{{ range . }}{{ $names = append $names (dict "name" .) }}{{ end }}
{{- $pull = printf "      imagePullSecrets: %s\n" (toJson $names) }}
{{- end }}
{{- /* The platform build of Coder has the add-ons built in: only /__coder-ui/ is routed, nothing is rewritten. */ -}}
{{- $files := list "rbac.yaml" "rbac-workspaces.yaml" "rbac-cluster.yaml" "logs-db.yaml" "ui-service.yaml" }}
{{- if $u.nativeDashboard }}{{ $files = append $files "httproute-native.yaml" }}{{ else }}{{ $files = concat $files (list "middlewares.yaml" "httproute.yaml") }}{{ end }}
{{- if $kcNs }}{{ $files = append $files "rbac-keycloak.yaml" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-ui-updates
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: coder-ui-updates
    {{- include "cp.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/ui/*" }}
  {{- if not (or (hasSuffix ".yaml" (base $path)) (hasSuffix ".gif" (base $path)) (hasSuffix ".png" (base $path))) }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
  {{- end }}
binaryData:   # images (the Workspaces icon)
  {{- range $path, $_ := .Files.Glob "files/ui/*.{gif,png}" }}
  {{ base $path }}: {{ $.Files.Get $path | b64enc }}
  {{- end }}
{{- range $files }}
{{- $text := $.Files.Get (printf "files/ui/%s" .) }}
{{- range $k, $v := $fill }}{{ $text = $text | replace $k $v }}{{ end }}
{{- if $pull }}{{ $text = $text | replace "      securityContext:\n        runAsNonRoot: true" (printf "%s      securityContext:\n        runAsNonRoot: true" $pull) }}{{ end }}
{{- with $.Values.global.nodeSelector }}{{ $text = $text | replace "      securityContext:\n        runAsNonRoot: true" (printf "      nodeSelector: %s\n      securityContext:\n        runAsNonRoot: true" (toJson .)) }}{{ end }}
{{- if eq . "httproute.yaml" }}
{{- /* Last Argo CD sync wave, like Coder's own route. */ -}}
{{- $text = $text | replace "  labels: {" "  annotations: {argocd.argoproj.io/sync-wave: \"4\"}\n  labels: {" }}
{{- end }}
{{- if regexFind "@@[A-Z_]+@@" $text }}{{ fail (printf "files/ui/%s: unfilled placeholder %s" . (regexFind "@@[A-Z_]+@@" $text)) }}{{ end }}
---
{{ $text }}
{{- end }}
{{- end }}
