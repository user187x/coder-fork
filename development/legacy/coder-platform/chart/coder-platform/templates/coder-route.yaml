{{- /*
Coder's own route: its hostname and the wildcard for workspace apps. Other routes on the same hostname (the banner,
the dashboard add-ons, the icons) are more specific and win for their paths; everything else comes here.
Last Argo CD sync wave: a route is Healthy only once the Gateway accepts it, so a Gateway problem holds back just the
routes, not the database, Coder or the bootstrap.
*/ -}}
{{- if not .Values.attach.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  hostnames:
    - {{ include "cp.coderHost" . | quote }}
    {{- with include "cp.wildcardHost" . }}
    - {{ . | quote }}
    {{- end }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      {{- with .Values.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "cp.coderService" . }}
          port: 80
          weight: 1
{{- end }}
