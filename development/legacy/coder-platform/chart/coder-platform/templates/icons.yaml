{{- /*
Custom app icons for the workspace template, served at https://<coderHost>/__icons/<file>. coder_app.icon is limited
to 256 characters (no data: URLs) and Coder's own /icon/ set is built into the server, so the files in
files/workspace/icons/ are served by a small nginx on Coder's hostname (its own route, only /__icons/).
*/ -}}
{{- if .Values.workspaces.icons.enabled }}
{{- $name := "coder-workspace-icons" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/workspace/icons/*" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
  default.conf: |
    server {
      listen 8080;
      location /__icons/ {
        alias /usr/share/nginx/icons/;
        add_header Cache-Control "public, max-age=3600";
      }
      location = /healthz { return 200; }
      location / { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "cp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
      annotations:
        checksum/icons: {{ .Files.Glob "files/workspace/icons/*" | toString | sha256sum | trunc 16 }}
    spec:
      {{- include "cp.imagePullSecrets" . | nindent 6 }}
      {{- include "cp.nodeSelector" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: {{ include "cp.image" (list . .Values.workspaces.icons.image) | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: icons
              mountPath: /usr/share/nginx/icons
            - name: icons
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: icons
          configMap:
            name: {{ $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  hostnames:
    - {{ include "cp.coderHost" . | quote }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      {{- with .Values.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /__icons/
      backendRefs:
        - name: {{ $name }}
          port: 80
{{- end }}
