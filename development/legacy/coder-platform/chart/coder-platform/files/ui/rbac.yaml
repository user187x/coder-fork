# What the coder-ui-updates service may do in the cluster (the Keycloak and Persistence views need it). Every rule names the
# objects it covers where Kubernetes allows that; creating a Secret cannot be limited by name, so the service only
# ever creates the two Secrets Coder reads (keycloaking-coder-oidc, keycloaking-coder-ca) and the log database's
# password (coder-ui-logs-db); see ui-service.py.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-ui-updates
  namespace: @@NAMESPACE@@
  labels: @@LABELS@@
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-ui-updates
  namespace: @@NAMESPACE@@
  labels: @@LABELS@@
rules:
  # the local CA (to trust Keycloak), the OIDC client secret and CA Coder reads
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [@@CA_SOURCE_SECRET@@, keycloaking-coder-oidc, keycloaking-coder-ca, "@@OIDC_SECRET_NAME@@"]
    verbs: [get, update, patch]
  # the temporary log database's password (created by the service if missing), and Coder's database connection +
  # CA for the logo (read here when the pod started before the database existed)
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [coder-ui-logs-db, "@@CODER_DB_SECRET@@", "@@CODER_DB_CA_SECRET@@"]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  # Security > certificates: the Secrets Coder's Deployment mounts (its TLS certificate, CAs), read-only. Never empty
  # (an empty resourceNames would mean every Secret): the CA Secret above is always one of them.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [@@CODER_CERT_SECRETS@@]
    verbs: [get]
  # Coder's running configuration (its environment), to compare with what Argo CD declares
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [@@CODER_SERVICE@@]
    verbs: [get]
  # ... including settings it reads from a ConfigMap (envFrom; the coder-platform chart)
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [coder-platform-config]
    verbs: [get]
  # General > Persistence: Coder's CloudNativePG cluster (read it; create one; scale it, grow its storage, turn on
  # snapshot backups), its scheduled and finished backups, and its instances' volumes
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, create, patch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [backups, scheduledbackups]
    verbs: [get, list, create]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-ui-updates
  namespace: @@NAMESPACE@@
  labels: @@LABELS@@
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-ui-updates
subjects:
  - kind: ServiceAccount
    name: coder-ui-updates
    namespace: @@NAMESPACE@@
