# Traefik for the e2e cluster: the same shape as the production prerequisite (Gateway API provider, a shared Gateway
# "traefik-gateway" with listeners http + https, a wildcard certificate). The rewrite-body plugin is NOT here: the
# bundle's ./install plugin enables it, as it would on a real cluster.
providers:
  kubernetesGateway:
    enabled: true
  kubernetesCRD:
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: false
gatewayClass:
  enabled: true
  name: traefik
gateway:
  enabled: true
  name: traefik-gateway
  listeners:
    web: null
    http:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All
    https:
      port: 8443
      protocol: HTTPS
      namespacePolicy:
        from: All
      certificateRefs:
        - kind: Secret
          name: wildcard-tls
service:
  type: NodePort
ports:
  web:
    nodePort: 30080
  websecure:
    nodePort: 30443
