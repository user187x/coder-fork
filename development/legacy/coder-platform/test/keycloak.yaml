# A throwaway Keycloak for the e2e cluster (dev mode, realm "cp" imported at start): client "coder" and two users.
# Stands in for the production Keycloak, which the bundle doesn't install.
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: realm
  namespace: keycloak
data:
  cp-realm.json: |
    {
      "realm": "cp",
      "enabled": true,
      "sslRequired": "none",
      "clients": [{
        "clientId": "coder",
        "enabled": true,
        "publicClient": false,
        "secret": "e2e-client-secret",
        "protocol": "openid-connect",
        "standardFlowEnabled": true,
        "directAccessGrantsEnabled": false,
        "redirectUris": ["https://coder.cp.test/*"],
        "webOrigins": ["https://coder.cp.test"],
        "protocolMappers": [{
          "name": "groups", "protocol": "openid-connect", "protocolMapper": "oidc-group-membership-mapper",
          "config": {"claim.name": "groups", "full.path": "true", "id.token.claim": "true",
                     "access.token.claim": "true", "userinfo.token.claim": "true"}
        }]
      }],
      "groups": [{"name": "KeycloakGroup", "subGroups": [{"name": "Admin"}]}],
      "users": [
        {"username": "jdoe", "email": "jdoe@cp.test", "emailVerified": true, "firstName": "Jane", "lastName": "Doe",
         "enabled": true, "groups": ["/KeycloakGroup/Admin"],
         "credentials": [{"type": "password", "value": "e2e-Passw0rd", "temporary": false}]},
        {"username": "alice", "email": "alice@cp.test", "emailVerified": true, "firstName": "Alice", "lastName": "User",
         "enabled": true, "credentials": [{"type": "password", "value": "e2e-Passw0rd", "temporary": false}]}
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.4
          args: [start-dev, --import-realm]
          env:
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: e2e-admin}
            - {name: KC_HOSTNAME, value: "https://keycloak.cp.test"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health/ready, port: 9000}
            periodSeconds: 5
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import}
      volumes:
        - name: realm
          configMap: {name: realm}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector: {app: keycloak}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  hostnames: [keycloak.cp.test]
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: traefik-gateway, namespace: traefik, sectionName: https}
  rules:
    - backendRefs:
        - {name: keycloak, port: 80}
