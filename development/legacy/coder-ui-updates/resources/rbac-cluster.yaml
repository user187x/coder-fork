# General > Network: the cluster map. Read-only and cluster-wide, because nodes are cluster-scoped and the map counts
# every pod per node (requests, namespaces): list nodes and pods, and node usage from metrics-server when it runs.
# Health > User Quota: workspace pods' live usage from metrics-server.
# General > Persistence: storage and snapshot classes, and whether the CloudNativePG operator is installed (its CRD,
# and its Deployment in whatever namespace it runs). No Secrets, no logs, no changes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coder-ui-updates-@@NAMESPACE@@
  labels: @@LABELS@@
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotclasses]
    verbs: [get, list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [clusters.postgresql.cnpg.io]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coder-ui-updates-@@NAMESPACE@@
  labels: @@LABELS@@
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: coder-ui-updates-@@NAMESPACE@@
subjects:
  - kind: ServiceAccount
    name: coder-ui-updates
    namespace: @@NAMESPACE@@
