# 4b. Smaller chunks, each rule only matches in its own: two General pages (assets/SecuritySettingsPage-<hash>.js,
#     ObservabilitySettingsPage-<hash>.js), Coder's avatar component (assets/Avatar-<hash>.js), the workspace page
#     (assets/WorkspacePage-<hash>.js) and the Account page (assets/AccountPage-<hash>.js).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: coder-ui-updates-pages-rewrite
  namespace: @@NAMESPACE@@
  labels: @@LABELS@@
spec:
  plugin:
    @@PLUGIN@@:
      rewrites:
        # a) Security: no "Browser-Only Connections" section (heading, text and its Premium notice).
        - regex: ',(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\(`div`,\{children:\[(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\([\w$]+,\{children:\[(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\([\w$]+,\{level:`h2`,hierarchy:`secondary`,className:`items-center`,children:\[`Browser-Only Connections`(?s:.*?)source:`browser_only`,(?s:.*?)canViewPremium:!0\}\)\]\}\)'
          replacement: ''
        # b) Observability: no "Audit Logging" section (heading, text, the retention setting or its Premium notice).
        - regex: ',(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\([\w$]+,\{children:\[(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\([\w$]+,\{hierarchy:`secondary`,level:`h2`,children:`Audit Logging`\}\),(?s:.*?)\]\}\)\]\}\),[\w$]+\?(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\([\w$]+,\{options:[\w$]+\.filter\([\w$]+=>[\w$]+\.name===`Audit Logs Retention`\)\}\):(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\([\w$]+,\{source:`observability`,message:`Audit Logging`,(?s:.*?)canViewPremium:[\w$]+\}\)'
          replacement: ''
        # c) Coder's avatar component (assets/Avatar-<hash>.js), used for every user avatar: a user who uploaded a
        #    picture (User menu > Avatar) gets it instead, looked up by username (the fallback text Coder passes: the
        #    user menu, workspace lists and most other places pass the username), shown as a circle inside Coder's
        #    rounded square (class coder-ui-avatar, dashboard.css). boot.js sets window.__cuiAvatars.
        #    A user with neither an uploaded picture nor one of Coder's own (Keycloak / OIDC) gets the default avatar, if
        #    one is installed (resources/defaults/): boot.js sets window.__cuiAvatarDefault and dashboard.js fills
        #    window.__cuiAvatarUsers, the usernames it applies to (signed-in pages only).
        - regex: '([\w$]+)=\(\{className:([\w$]+),size:([\w$]+),variant:([\w$]+),src:([\w$]+),fallback:([\w$]+),alt:([\w$]+)=``,children:([\w$]+),\.\.\.([\w$]+)\}\)=>\{'
          replacement: '${1}=({className:${2},size:${3},variant:${4},src:${5},fallback:${6},alt:${7}=``,children:${8},...${9}})=>{let __cuiA=${4}!==`icon`&&typeof ${6}==`string`&&window.__cuiAvatars?Object.hasOwn(window.__cuiAvatars,${6})?window.__cuiAvatars[${6}]:!${5}&&window.__cuiAvatarDefault&&window.__cuiAvatarUsers?.has(${6})?window.__cuiAvatarDefault:null:null;if(__cuiA){${5}=__cuiA;${2}=[${2},`coder-ui-avatar`].filter(Boolean).join(` `)}'
        # c2) Account page (assets/AccountPage-<hash>.js): your avatar, large, above Email / Username / Name; a click
        #     changes it (the User menu's Avatar dialog). /__coder-ui/account-avatar.js draws it.
        - regex: '((?:[\w$]+|\(0,[\w$]+\.jsx\)))\(([\w$]+),\{field:([\w$]+)\(`email`\),label:`Email`'
          replacement: '${1}(`div`,{className:`coder-ui-account-avatar`,ref:__cuiE=>{if(__cuiE&&!__cuiE.dataset.cui){__cuiE.dataset.cui=`1`;import(`/__coder-ui/account-avatar.js`).then(__cuiM=>__cuiM.mount(__cuiE)).catch(()=>{})}}}),${1}(${2},{field:${3}(`email`),label:`Email`'
        # d) Workspace page (assets/WorkspacePage-<hash>.js): every agent gets a "Terminal" drop-down right after its
        #    "Logs" one, built from the same parts (Coder's Collapsible ${4}, its trigger ${5}, button ${6}, chevron ${7}
        #    and content ${8}): the agent's terminal inside the page, no new window; /__coder-ui/agent-terminal.js fills it
        #    and offers to end the session when it is closed. The chevron gets no `open` prop: it then turns with the
        #    trigger's data-state (Coder's group-data-[state=open] variant), so the drop-down needs no React state.
        #    Anchored on the Logs section's own markup and the end of the agent row (`]},<agent>.id)}`) that follows it.
        - regex: '(((?:[\w$]+|\(0,[\w$]+\.jsx\)))\(`section`,\{className:`border-0 border-t border-solid border-border`,children:((?:[\w$]+|\(0,[\w$]+\.jsxs\)))\(([\w$]+),\{open:[\w$]+,onOpenChange:[\w$]+,children:\[(?:[\w$]+|\(0,[\w$]+\.jsx\))\(`div`,\{className:`px-4 py-2 relative`,children:(?:[\w$]+|\(0,[\w$]+\.jsx\))\(([\w$]+),\{asChild:!0,children:(?:[\w$]+|\(0,[\w$]+\.jsxs\))\(([\w$]+),\{variant:`subtle`,className:`after:content-\[''''\] after:absolute after:inset-0`,children:\[(?:[\w$]+|\(0,[\w$]+\.jsx\))\(([\w$]+),\{open:[\w$]+\}\),(?:[\w$]+|\(0,[\w$]+\.jsx\))\(`span`,\{children:`Logs`\}\)(?s:.*?)(?:[\w$]+|\(0,[\w$]+\.jsx\))\(([\w$]+),\{children:(?:[\w$]+|\(0,[\w$]+\.jsxs\))\(`div`,\{className:[\w$]+\(`px-4`,(?s:.*?)troubleshootingURL:[\w$]+\.troubleshooting_url(?s:.*?))\]\},([\w$]+)\.id\)\}'
          replacement: '${1},${2}(`section`,{className:`border-0 border-t border-solid border-border coder-ui-term`,ref:__cuiE=>{if(__cuiE&&!__cuiE.dataset.cui){__cuiE.dataset.cui=`1`;import(`/__coder-ui/agent-terminal.js`).then(__cuiM=>__cuiM.attach(__cuiE,${9})).catch(()=>{})}},children:${3}(${4},{children:[${3}(`div`,{className:`px-4 py-2 relative flex items-center gap-2`,children:[${2}(${5},{asChild:!0,children:${3}(${6},{variant:`subtle`,className:`group after:content-[''''] after:absolute after:inset-0`,children:[${2}(${7},{}),${2}(`span`,{children:`Terminal`})]})}),${2}(`span`,{className:`coder-ui-term-status`})]}),${2}(${8},{children:${2}(`div`,{className:`coder-ui-term-body`})})]})})]},${9}.id)}'
