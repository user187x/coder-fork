# Traefik Middlewares that rewrite Coder's dashboard JavaScript (rendered and applied by ../coder-ui-updates).
#
# Coder's dashboard is client-rendered, so the menu and sidebar items exist in no HTML body: they are changed in the
# two JavaScript chunks that render them, with the same rewrite-body plugin the coder-banner chart uses.
# The chunks are minified, so identifiers (V, YB, pc ...) change between Coder builds. Every regex is anchored on
# things a minifier keeps (property names, string literals) and CAPTURES the identifiers. A regex that stops matching
# after a Coder upgrade rewrites nothing and Coder shows its stock UI: run `../coder-ui-updates verify` after upgrading.
#
# Tested against Coder v2.36.0 (a300a06) and v2.37.3 (3a24816). Go RE2 syntax; ${n} are capture groups. In replacements
# `$` must never appear otherwise; in regexes it appears only inside [\w$] (minified identifiers may be `$`).
# JSX calls are matched in both forms Coder's builds have used: `V(K,{...})` (2.36) and `(0,X.jsx)(K,{...})` (2.37).
# Placeholders (@@...@@) are filled in by the script.

# 1. rewrite-body cannot rewrite compressed bodies: ask Coder for an uncompressed chunk. Conditional headers are
#    dropped so the backend never answers 304 with nothing to rewrite.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: coder-ui-updates-identity-encoding
  namespace: @@NAMESPACE@@
  labels: @@LABELS@@
spec:
  headers:
    customRequestHeaders:
      Accept-Encoding: ""
      If-None-Match: ""
      If-Modified-Since: ""
---
# 2. Outermost: compress the rewritten chunk again for the browser (it still sent its own Accept-Encoding).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: coder-ui-updates-compress
  namespace: @@NAMESPACE@@
  labels: @@LABELS@@
spec:
  compress: {}
---
# 2b. The rewritten chunks keep Coder's file names, which Coder marks as cacheable for a year ("immutable"): a browser
#     would keep an old rewrite long after an update. For these two chunks only, a 5-minute lifetime instead.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: coder-ui-updates-cache
  namespace: @@NAMESPACE@@
  labels: @@LABELS@@
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "public, max-age=300"
---
# 3. Entry chunk (assets/index-<hash>.js).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: coder-ui-updates-index-rewrite
  namespace: @@NAMESPACE@@
  labels: @@LABELS@@
spec:
  plugin:
    @@PLUGIN@@:
      rewrites:
        # 0) Load dashboard.js on every page (classification marking; announcement Markdown / countdown / "Confirm" and
        #    who saw / confirmed it). \A is the start of the chunk; a dynamic import is not hoisted like the chunk's
        #    own imports, and a failure only logs.
        - regex: '\A'
          replacement: 'import(`/__coder-ui/dashboard.js`).catch(()=>{});'
        # a) User menu: drop support links by name. All support links (desktop dropdown, mobile menu, navbar
        #    buttons) come from this one loop over appearance.support_links, so filtering it covers every menu.
        - regex: 'for\(let ([\w$]+) of ([\w$]+)\.support_links\?\?\[\]\)'
          replacement: 'for(let ${1} of (${2}.support_links??[]).filter(__cuiL=>!@@HIDDEN_LINKS@@.includes(String(__cuiL.name).trim().toLowerCase())))'
        # a2) User menu: a "Dark Mode" switch where "Documentation" was (first after the separator that precedes the
        #     support links, which (a) removes), shown even when no support link is left. Choosing it keeps the menu open;
        #     /__coder-ui/theme-toggle.js flips the user's appearance between "Dark default" and "Light default".
        - regex: '([\w$]+)&&[\w$]+\.length>0&&((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\(([\w$]+)\.Fragment,\{children:\[((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\(([\w$]+),\{\}\),[\w$]+\.map\(([\w$]+)=>((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\(([\w$]+),\{asChild:!0,children:((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\(`a`,\{href:[\w$]+\.target,target:`_blank`,rel:`noreferrer`,children:\['
          replacement: '${2}(${3}.Fragment,{children:[${4}(${5},{}),${7}(${8},{role:`menuitemcheckbox`,"aria-checked":!1,className:`coder-ui-theme-item`,onSelect:__cuiE=>{__cuiE.preventDefault();import(`/__coder-ui/theme-toggle.js`).then(__cuiM=>__cuiM.toggle()).catch(()=>{})},children:[${7}(`span`,{className:`coder-ui-theme-icon`,"aria-hidden":!0}),${7}(`span`,{children:`Dark Mode`}),${7}(`span`,{className:`coder-ui-switch`,"aria-hidden":!0,ref:__cuiE=>{if(__cuiE&&!__cuiE.dataset.cui){__cuiE.dataset.cui=`1`;import(`/__coder-ui/theme-toggle.js`).then(__cuiM=>__cuiM.bind(__cuiE)).catch(()=>{})}}})]}),...(${1}??[]).map(${6}=>${7}(${8},{asChild:!0,children:${9}(`a`,{href:${6}.target,target:`_blank`,rel:`noreferrer`,children:['
        # a3) The dashboard's theme comes from the user's appearance query: expose it (window.__cuiAppearance) so the
        #     Dark Mode switch can have Coder re-read the setting it just saved, and the theme changes at once.
        - regex: '([\w$]+)=([\w$]+)\(([\w$]+)\(([\w$]+)\.userAppearance\)\),'
          replacement: '${1}=(window.__cuiAppearance=${2}(${3}(${4}.userAppearance))),'
        # b) Navbar: hand the real "may list users" permission to the Admin settings menu. One regex from the
        #    permissions destructuring to the adminPermissions object, so it is applied completely or not at all.
        - regex: 'permissions:([\w$]+),signOut:([\w$]+)\}=((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\(\)(,.*?)adminPermissions:\{canViewDeployment:'
          replacement: 'permissions:${1},signOut:${2}}=${3}()${4}adminPermissions:{canViewUsers:!!${1}.viewAllUsers,canViewDeployment:'
        # c) Admin menu (desktop dropdown and mobile menu share it): "Deployment" is called "Settings" (the section it
        #    opens is General), and "Accounts" (Coder's users page) follows it.
        #    `=== true` keeps it hidden if (b) ever stops matching.
        - regex: '([\w$]+)\.canViewDeployment&&((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\(([\w$]+),\{asChild:!0,className:([\w$]+),children:((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\(([\w$]+),\{to:`/deployment`,children:`Deployment`\}\)\}\)'
          replacement: '${1}.canViewDeployment&&${2}(${3},{asChild:!0,className:${4},children:${5}(${6},{to:`/deployment`,children:`Settings`})}),${1}.canViewUsers===!0&&${2}(${3},{asChild:!0,className:${4},children:${5}(${6},{to:`/deployment/users`,children:`Accounts`})})'
        # c2) Admin settings menu: "AI" moves into General's sidebar (see the sidebar rewrites).
        - regex: '([\w$]+)\.canViewAISettings&&((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\(([\w$]+),\{asChild:!0,className:([\w$]+),children:((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\(([\w$]+),\{to:`/ai/settings`,children:`AI`\}\)\}\)'
          replacement: '!1'
        # c2b) Navbar: "Workspaces" becomes a drop-down built exactly like the Admin menu (same outline button, size,
        #      chevron and 180px menu), its label an icon (/__coder-ui/workspaces-icon.png, made from windows.png), with "Workspace" (the workspaces
        #      list) and "Templates". Defined next to the Admin menu, whose parts it reuses (menu, trigger, button,
        #      content, chevron) with the menu item and link of the entry just before it, "Healthcheck", now "Health".
        #      The Admin menu itself ends with the cluster's CPU and memory, live (/__coder-ui/cluster-gauge.js; admins
        #      only, it stays empty for anyone else): what the cluster still has to give developers.
        - regex: '&&((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\(([\w$]+),\{asChild:!0,className:([\w$]+),children:((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\(([\w$]+),\{to:`/health`,children:`Healthcheck`\}\)\}\)\]\}\),([\w$]+=[\w$]+=>Object\.values\([\w$]+\)\.some\([\w$]+=>[\w$]+\)),([\w$]+)=(\(\{permissions:[\w$]+\}\)=>((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\(([\w$]+),\{children:\[((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\(([\w$]+),\{asChild:!0,children:(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\(([\w$]+),\{variant:`outline`,size:`lg`,children:\[`Admin settings`,(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\(([\w$]+),\{className:`text-content-primary`\}\)\]\}\)\}\),(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\(([\w$]+),\{align:`end`,className:`w-\[180px\] min-w-auto`,children:(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\(`nav`,\{children:(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\([\w$]+,\{permissions:[\w$]+\}\)\}\)\}\)\]\}\))'
          replacement: '&&${1}(${2},{asChild:!0,className:${3},children:${4}(${5},{to:`/health`,children:`Health`})}),${1}(`div`,{className:`coder-ui-cluster`,role:`group`,"aria-label":`Cluster CPU and memory`,ref:__cuiE=>{if(__cuiE&&!__cuiE.dataset.cui){__cuiE.dataset.cui=`1`;import(`/__coder-ui/cluster-gauge.js`).then(__cuiM=>__cuiM.mount(__cuiE)).catch(()=>{})}}})]}),${6},${7}=${8},__cuiWsMenu=()=>${9}(${10},{children:[${11}(${12},{asChild:!0,children:${9}(${13},{variant:`outline`,size:`lg`,"aria-label":`Workspaces`,title:`Workspaces`,className:`coder-ui-ws-trigger`,children:[${11}(`img`,{src:`/__coder-ui/workspaces-icon.png`,alt:``,className:`coder-ui-ws-icon`}),${11}(${14},{className:`text-content-primary`})]})}),${11}(${15},{align:`start`,className:`w-[180px] min-w-auto`,children:${9}(`nav`,{children:[${11}(${2},{asChild:!0,children:${11}(${5},{to:`/workspaces`,children:`Workspace`})}),${11}(${2},{asChild:!0,children:${11}(${5},{to:`/templates`,children:`Templates`})})]})})]})'
        # c2c) ... in place of the "Workspaces" and "Templates" links. "Agents" leaves the navbar: it is
        #      General > AI > Agents.
        - regex: '((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\([\w$]+,\{className:\(\{isActive:[\w$]+\}\)=>\(([\w$]+)\.pathname\.startsWith\(`/@`\)&&\([\w$]+=!0\),([\w$]+)\(([\w$]+)\.default,\{\[[\w$]+\.active\]:[\w$]+\}\)\),to:`/workspaces`,children:`Workspaces`\}\),(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\([\w$]+,\{className:\(\{isActive:[\w$]+\}\)=>[\w$]+\([\w$]+\.default,\{\[[\w$]+\.active\]:[\w$]+\}\),to:`/templates`,children:`Templates`\}\),((?:[\w$]+|\(0,[\w$]+\.jsxs?\))\([\w$]+,\{user:[\w$]+\}\)),[\w$]+&&(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\([\w$]+,\{className:\(\{isActive:[\w$]+\}\)=>[\w$]+\([\w$]+\.default,\{\[[\w$]+\.active\]:[\w$]+\}\),to:`/agents`,children:`Agents`\}\)'
          replacement: '${1}(__cuiWsMenu,{}),${5}'
        # c2d) Mobile menu: no "Agents" either.
        - regex: ',(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\([\w$]+,\{asChild:!0,className:[\w$]+\.default,children:(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\([\w$]+,\{to:`/agents`,children:`Agents`\}\)\}\)'
          replacement: ''
        # c2e) User settings: "Appearance" moved to General > Customize (its /settings/appearance page still answers).
        - regex: '(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\([\w$]+,\{href:`appearance`,children:`Appearance`\}\),'
          replacement: ''
        # c2f) The "Admin settings" menu is called "Admin" (desktop button and the mobile menu's entry). After c2b,
        #      which is anchored on the old text.
        - regex: '\[`Admin settings`,'
          replacement: '[`Admin`,'
        # c2g) User menu: "Avatar" after "Account": /__coder-ui/avatar.js opens a dialog to upload your own picture.
        - regex: '((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\(([\w$]+),\{asChild:!0,children:((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\(([\w$]+),\{to:`/settings/account`,children:\[((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\(([\w$]+),\{\}\),(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\(`span`,\{children:`Account`\}\)\]\}\)\}\)'
          replacement: '${1}(${2},{asChild:!0,children:${3}(${4},{to:`/settings/account`,children:[${5}(${6},{}),${5}(`span`,{children:`Account`})]})}),${1}(${2},{className:`coder-ui-avatar-item`,onSelect:()=>{import(`/__coder-ui/avatar.js`).then(__cuiM=>__cuiM.open()).catch(()=>{})},children:[${5}(`span`,{className:`coder-ui-avatar-icon`,"aria-hidden":!0}),${5}(`span`,{children:`Avatar`})]})'
        # c2g2) Admin > Users (and General > Users), each user's row:
