        # 0) The breadcrumb "Admin Settings / Deployment" reads "Admin Settings / General".
        - regex: '((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\(([\w$]+),\{className:`text-content-primary`,children:`Deployment`\}\)'
          replacement: '${1}(${2},{className:`text-content-primary`,children:`General`})'
        # 0b) The frame around the sidebar and the page (gap-28 / py-10 on large screens) gets a class of its own:
        #     dashboard.css tightens it, so the page starts closer to the sidebar and has that room for itself.
        - regex: 'className:`flex flex-col gap-8 py-6 lg:flex-row lg:gap-28 lg:py-10`'
          replacement: 'className:`flex flex-col gap-8 py-6 lg:flex-row lg:gap-28 lg:py-10 coder-ui-settings-frame`'
        # a) The sidebar, rebuilt in one piece and in alphabetical order (by the default labels). Coder's items keep their
        #    permissions; "Licenses", "Workspace Proxies", "Groups", "IdP Organization Sync", "Premium" and "External
        #    Authentication" are left out; "Appearance" becomes "@@VIEW_LABEL@@" (for the admins who may edit the
        #    deployment); "User Authentication" is called "Authentication" (its page starts with the Keycloak view, see
        #    router rule f); "Classification", "Customize" (the logo + Coder's Appearance) and "Monitoring" are
        #    added, "Users" is called "Accounts", and "AI" (moved here from the Admin settings menu) is a tree: a collapsible entry (native <details>, open
        #    while one of its pages is shown) with "Agents" (Coder Agents, moved here from the navbar; opens inside General)
        #    and the pages of Coder's own AI settings sidebar, same permissions, but for "AI Governance" and "AI
        #    Gateway keys" (left out; their URLs still answer). The tree mirrors Coder v2.37's AI sidebar
        #    (Models top level; no Spend page since v2.37); every link also exists in v2.36. The OAuth2 item keeps Coder's
        #    own condition (${4}: the oauth2 experiment or a development build).
        - regex: 'children:\[([\w$]+)\.viewDeploymentConfig&&((?:[\w$]+|\(0,[\w$]+\.jsxs?\)))\(([\w$]+),\{href:`/deployment/overview`,children:`Overview`\}\),(?s:.*?)[\w$]+\.viewDeploymentConfig&&(\([^&]*?\))&&(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\([\w$]+,\{href:`/deployment/oauth2-provider/apps`,children:`OAuth2 Applications`\}\),(?s:.*?)![\w$]+&&(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\([\w$]+,\{href:`/deployment/premium`,children:`(?:Premium|Trial Upgrade)`\}\)\]'
          replacement: 'children:[${1}.viewAllUsers&&${2}(${3},{href:`/deployment/users`,children:`Accounts`}),(${1}.viewAnyAIProvider||${1}.editDeploymentConfig||${1}.createChat)&&${2}(`details`,{className:`coder-ui-ai-tree`,open:/^[/](ai[/]settings|deployment[/]agents)/.test(location.pathname),children:[${2}(`summary`,{className:`relative text-sm text-content-secondary font-medium py-2 px-3 hover:bg-surface-secondary rounded-md transition ease-in-out duration-150 cursor-pointer select-none flex items-center justify-between`,children:[`AI`,${2}(`span`,{className:`coder-ui-ai-chevron`,"aria-hidden":!0,children:`›`})]}),${2}(`div`,{className:`flex flex-col gap-1 ml-3 mt-1 pl-1 border-0 border-solid border-l border-l-border`,children:[${1}.createChat&&${2}(${3},{href:`/deployment/agents`,children:`Agents`}),${1}.viewAnyAIProvider&&${2}(${3},{href:`/ai/settings/providers`,children:`Providers`}),${1}.editDeploymentConfig&&${2}(${3},{href:`/ai/settings/models`,children:`Models`}),${1}.editDeploymentConfig&&${2}(${3},{href:`/ai/settings/coder-agents`,children:`Coder Agents`}),${1}.editDeploymentConfig&&${2}(`div`,{className:`flex flex-col gap-1 ml-3 pl-1 border-0 border-solid border-l border-l-border`,children:[${2}(${3},{href:`/ai/settings/mcp-servers`,children:`MCP servers`}),${1}.updateAnyTemplate&&${2}(${3},{href:`/ai/settings/templates`,children:`Templates`}),${2}(${3},{href:`/ai/settings/instructions`,children:`Instructions`}),${2}(${3},{href:`/ai/settings/lifecycle`,children:`Lifecycle`})]})]})]}),${1}.editDeploymentConfig&&${2}(${3},{href:`/deployment/@@VIEW_PATH@@`,children:`@@VIEW_LABEL@@`}),${1}.viewDeploymentConfig&&${2}(${3},{href:`/deployment/userauth`,children:`Authentication`}),${1}.editDeploymentConfig&&${2}(${3},{href:`/deployment/classification`,children:`Classification`}),${1}.editDeploymentConfig&&${2}(${3},{href:`/deployment/customize`,children:`Customize`}),${1}.editDeploymentConfig&&${2}(${3},{href:`/deployment/monitoring`,children:`Monitoring`}),${1}.viewDeploymentConfig&&${2}(${3},{href:`/deployment/network`,children:`Network`}),${1}.viewNotificationTemplate&&${2}(${3},{href:`/deployment/notifications`,children:`Notifications`}),${1}.viewDeploymentConfig&&${4}&&${2}(${3},{href:`/deployment/oauth2-provider/apps`,children:`OAuth2 Applications`}),${1}.viewDeploymentConfig&&${2}(${3},{href:`/deployment/observability`,children:`Observability`}),${1}.viewDeploymentConfig&&${2}(${3},{href:`/deployment/overview`,children:`Overview`}),${1}.viewDeploymentConfig&&${2}(${3},{href:`/deployment/security`,children:`Security`})]'
