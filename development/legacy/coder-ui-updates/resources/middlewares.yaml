        - regex: '((?:[\w$]+|\(0,[\w$]+\.jsxs\)))\(([\w$]+),\{("data-testid":`user-.\{([\w$]+)\.id\}`,children:\[((?:[\w$]+|\(0,[\w$]+\.jsx\)))\([\w$]+,\{children:)((?:[\w$]+|\(0,[\w$]+\.jsx\))\([\w$]+,\{title:[\w$]+\.username,subtitle:[\w$]+\.is_service_account\?`Service Account`:[\w$]+\.email,src:[\w$]+\.avatar_url\}\))(\}\)(?s:.*?)(?:[\w$]+|\(0,[\w$]+\.jsxs?\))\(([\w$]+),\{size:`icon-lg`,variant:`subtle`,"aria-label":`Open menu`)'
