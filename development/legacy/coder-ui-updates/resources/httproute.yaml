# Sits beside Coder's own HTTPRoute and the coder-banner route on the same host; neither is modified.
#
# Precedence (Traefik's Gateway API provider): a PathPrefix / RegularExpression rule scores 10000 + 100 x the length of
# its path value, plus the length of the longest hostname, plus (number of rules - rule index). The coder-banner route
# matches the entry chunk with  ^/assets/index-[A-Za-z0-9_-]+\.js$  (34 characters); the pattern below is 4 characters
# longer (+400), which outweighs any rule-order bonus, so this route always serves the entry chunk. The same scoring
# makes the page-load rule below win over the banner route's HTML rule; this route adds the banner loader itself.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder-ui-updates
  namespace: @@NAMESPACE@@
  labels: @@LABELS@@
spec:
  hostnames:
    - "@@HOST@@"
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: @@GATEWAY_NAME@@
      namespace: @@GATEWAY_NAMESPACE@@
@@SECTION_NAME@@
  rules:
    # The Announcement view, the banner "Confirm" tracker, receipts API, and the one-shot cache reset.
    - matches:
        - path:
            type: PathPrefix
            value: /__coder-ui/
      backendRefs:
        - name: coder-ui-updates
          port: 80
    # Entry chunk: loads ack.js, user menu support links, Admin settings "Users", router (Appearance -> Announcement).
    - matches:
        - path:
            type: RegularExpression
            value: '^/assets/index-[A-Za-z0-9_-]{4,64}\.js$'
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: coder-ui-updates-index
      backendRefs:
        - name: @@CODER_SERVICE@@
          port: @@CODER_PORT@@
    # Page loads (HTML): boot.js (logo + classification), favicons, and the banner loader. A regular-expression path
    # scores 10000 + 100 x its length, far above the coder-banner route's HTML rule (PathPrefix "/" scores 1), so this
    # rule serves page loads; paths starting with "_" (/__banner, /__coder-ui, /__icons) are left to their own routes.
    # Paths starting with "@" are Coder's workspace pages (/@owner/workspace, its builds/<n> and settings/<page>, and
    # /@owner/workspace[.agent]/terminal), matched by the second pattern: without boot.js there, those pages had no
    # custom logo and no uploaded avatars. Workspace apps (/@owner/workspace[.agent]/apps/...) are never matched.
    - matches:
        - path:
            type: RegularExpression
            value: '^/([^@_].*)?$'
          headers:
            - type: RegularExpression
              name: Accept
              value: '.*text/html.*'
        - path:
            type: RegularExpression
            value: '^/@[^/]+/[^/]+(/builds/[0-9]+|/settings(/[a-z-]+)?|/terminal)?/?$'
          headers:
            - type: RegularExpression
              name: Accept
              value: '.*text/html.*'
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: coder-ui-updates-html
      backendRefs:
        - name: @@CODER_SERVICE@@
          port: @@CODER_PORT@@
    # Deployment settings sidebar chunk: Licenses and Premium removed, Appearance -> Announcement.
    - matches:
        - path:
            type: RegularExpression
            value: '^/assets/DeploymentSettingsLayout-[A-Za-z0-9_-]+\.js$'
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: coder-ui-updates-layout
      backendRefs:
        - name: @@CODER_SERVICE@@
          port: @@CODER_PORT@@
    # General > Security and General > Observability page chunks (one section removed from each), Coder's avatar
    # component (uploaded and default avatars), the workspace page (each agent's Terminal drop-down) and the Account page
    # (your avatar above Email).
    - matches:
        - path:
            type: RegularExpression
            value: '^/assets/SecuritySettingsPage-[A-Za-z0-9_-]+\.js$'
        - path:
            type: RegularExpression
            value: '^/assets/ObservabilitySettingsPage-[A-Za-z0-9_-]+\.js$'
        - path:
            type: RegularExpression
            value: '^/assets/Avatar-[A-Za-z0-9_-]+\.js$'
        - path:
            type: RegularExpression
            value: '^/assets/WorkspacePage-[A-Za-z0-9_-]+\.js$'
        - path:
            type: RegularExpression
            value: '^/assets/AccountPage-[A-Za-z0-9_-]+\.js$'
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: coder-ui-updates-pages
      backendRefs:
        - name: @@CODER_SERVICE@@
          port: @@CODER_PORT@@
