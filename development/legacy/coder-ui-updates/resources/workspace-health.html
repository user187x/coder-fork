<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace Health · Coder</title>
  <link rel="stylesheet" href="/__coder-ui/view.css">
  <link rel="stylesheet" href="/__coder-ui/workspace-health.css">
  <style id="coder-ui-theme"></style>
</head>
<body>
<main>
  <section class="card" aria-labelledby="wh-h">
    <details class="acc" id="acc" open>
      <summary>
        <span class="state" id="state" aria-hidden="true"></span>
        <h2 id="wh-h">Unhealthy or failed workspaces</h2>
        <span class="pill info" id="count">Checking…</span>
        <span class="hint checked" id="checked"></span>
      </summary>
      <table>
        <thead><tr><th scope="col">Workspace</th><th scope="col">Problem</th><th scope="col">Template</th><th scope="col">Last build</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </details>
    <p class="hint foot">Select a workspace to open it. Checked every 30 seconds.</p>
  </section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/__coder-ui/workspace-health-view.js"></script>
</body>
</html>
