# Argo CD's namespace: Coder's own Application, whose Helm values hold Coder's OIDC settings. The Keycloak view
# rewrites only coder.env / coder.volumes / coder.volumeMounts there (and keeps a copy of the values before each change).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-ui-updates
  namespace: @@ARGOCD_NAMESPACE@@
  labels: @@LABELS@@
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [@@ARGOCD_APP@@]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-ui-updates
  namespace: @@ARGOCD_NAMESPACE@@
  labels: @@LABELS@@
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-ui-updates
subjects:
  - kind: ServiceAccount
    name: coder-ui-updates
    namespace: @@NAMESPACE@@
