coder:
  env:
    - name: CODER_BOOTSTRAP_INITIAL_USER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: coder-init-auth
          key: password
    - name: CODER_ACCESS_URL
      value: "https://coder.xxx.com"
    - name: CODER_WILDCARD_ACCESS_URL
      value: "*.xxx.com"
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-db-app
          key: uri
    - name: CODER_TLS_CA_CERT
      value: /etc/ssl/certs/ca.crt

  volumeMounts:
    - name: tls-coder-wildcard-tls
      mountPath: /etc/ssl/certs/coder/coder-wildcard-tls
      readOnly: true
    - name: ca-bundle
      mountPath: /etc/ssl/certs/ca.crt
      subPath: ca.crt

  volumes:
    - name: tls-coder-wildcard-tls
      secret:
        secretName: tls-wild-cert
    - name: ca-bundle
      secret:
        secretName: tls-ca
        items:
          - key: ca.crt
            path: ca.crt

  service:
    type: ClusterIP

  httproute:
    enable: true
    host: "coder.xxx.com"
    wildcardHost: "*.xxx.com"
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
        kind: Gateway
        group: gateway.networking.k8s.io

extraTemplates:
  - |
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      name: coder-db
    spec:
      instances: 2
      primaryUpdateStrategy: unsupervised
      storage:
        size: 10Gi
        storageClass: standard-k8s
