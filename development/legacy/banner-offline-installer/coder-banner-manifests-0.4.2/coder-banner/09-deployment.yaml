apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder-banner
  namespace: coder
  labels:
    app.kubernetes.io/name: coder-banner
    app.kubernetes.io/instance: coder-banner
    app.kubernetes.io/part-of: coder
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coder-banner
      app.kubernetes.io/instance: coder-banner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coder-banner
        app.kubernetes.io/instance: coder-banner
        app.kubernetes.io/part-of: coder
        app.kubernetes.io/managed-by: kubectl
      annotations:
        # Restart when the service code changes; banner defaults are re-read on every request.
        checksum/app: e1657fe4c36180d5
    spec:
      serviceAccountName: coder-banner
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: banner
          image: registry.internal:5000/library/python:3.13-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/server.py"]
          env:
            - { name: PORT, value: "8080" }
            - { name: APP_DIR, value: /app }
            - { name: DEFAULTS_FILE, value: /config/banner.json }
            - { name: VENDOR_DIR, value: /vendor }
            - { name: EMOJI_DIR, value: /emoji }
            - { name: STATE_CONFIGMAP, value: coder-banner-state }
            - { name: CODER_URL, value: "http://coder.coder.svc.cluster.local:80" }
            - { name: ADMIN_ROLES, value: "owner" }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: PYTHONUNBUFFERED, value: "1" }
            - { name: LIVE_ENABLED, value: "true" }
            - { name: LIVE_PORT, value: "8081" }
            - { name: LIVE_MAX_CLIENTS, value: "5000" }
            - { name: LIVE_HEARTBEAT, value: "20" }
          ports:
            - name: http
              containerPort: 8080
            - name: live
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
            - { name: defaults, mountPath: /config, readOnly: true }
            - { name: vendor, mountPath: /vendor, readOnly: true }
            - { name: emoji, mountPath: /emoji, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: app
          configMap:
            name: coder-banner-app
        - name: defaults
          configMap:
            name: coder-banner-content
        - name: vendor
          configMap:
            name: coder-banner-vendor
        - name: emoji
          configMap:
            name: coder-banner-emoji
        - name: tmp
          emptyDir: {}
