# Sits beside Coder's own HTTPRoute (which this chart never touches) on the same host. Gateway API
# precedence resolves the overlap: longer path prefixes win, and for equal paths the rule with more
# header matches wins - so only browser page loads (Accept: text/html) take the middleware path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder-banner
  namespace: coder
  labels:
    app.kubernetes.io/name: coder-banner
    app.kubernetes.io/instance: coder-banner
    app.kubernetes.io/part-of: coder
    app.kubernetes.io/managed-by: kubectl
spec:
  hostnames:
    - "coder.example.com"
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: "https"
  rules:
    # Loader script + banner.json + admin page
    - matches:
        - path:
            type: PathPrefix
            value: /__banner
      backendRefs:
        - name: coder-banner
          port: 80
    # WebSocket: open Coder tabs subscribe here and are told about a change the instant it is published.
    # A longer prefix than /__banner, so it wins for this path and goes to the hub's port.
    - matches:
        - path:
            type: PathPrefix
            value: /__banner/live
      backendRefs:
        - name: coder-banner
          port: 8081
    # Workspace apps etc.: straight to Coder, never rewritten.
    - matches:
        - path:
            type: PathPrefix
            value: "/@"
      backendRefs:
        - name: coder
          port: 80
    # Coder's entry JavaScript chunk only (no other chunk is named index-*.js): swap the "Codernauts"
    # user-menu item. Kept this narrow because rewrite-body buffers and regex-scans whatever reaches it.
    - matches:
        - path:
            type: RegularExpression
            value: '^/assets/index-[A-Za-z0-9_-]+\.js$'
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: coder-banner-menu
      backendRefs:
        - name: coder
          port: 80
    # Dashboard page loads: rewrite the HTML.
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - type: RegularExpression
              name: Accept
              value: ".*text/html.*"
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: coder-banner
      backendRefs:
        - name: coder
          port: 80
