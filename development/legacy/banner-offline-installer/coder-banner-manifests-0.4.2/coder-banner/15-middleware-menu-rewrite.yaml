# 5. Second response-body writer: replace the "Codernauts" user-menu item with a "Banner" link to the
#    admin page (see _menu.tpl for how and why it is written this way).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: coder-banner-menu-rewrite
  namespace: coder
  labels:
    app.kubernetes.io/name: coder-banner
    app.kubernetes.io/instance: coder-banner
    app.kubernetes.io/part-of: coder
    app.kubernetes.io/managed-by: kubectl
spec:
  plugin:
    rewrite-body:
      rewrites:
        - regex: "\\(\\{user:(\\w+),buildInfo:(\\w+),profileExtra:(\\w+),supportLinks:(\\w+),onSignOut:(\\w+)\\}\\)=\u003e\\{"
          replacement: "({user:${1},buildInfo:${2},profileExtra:${3},supportLinks:${4},onSignOut:${5}})=\u003e{let __bannerAdmin=(${1}.roles||[]).some(r=\u003e[\"owner\"].includes(r.name));"
        - regex: "(\\w+)\\((\\w+),\\{asChild:!0,children:(\\w+)\\(\\w+,\\{to:`/coder-cup`,children:\\[.*?(\\w+)\\(`span`,\\{children:`Codernauts`\\}\\)\\]\\}\\)\\}\\)"
          replacement: "(typeof __bannerAdmin===`undefined`||__bannerAdmin)\u0026\u0026${1}(${2},{asChild:!0,children:${3}(`a`,{href:`/__banner/admin`,children:[${3}(`svg`,{viewBox:`0 0 24 24`,fill:`none`,stroke:`currentColor`,strokeWidth:`1.5`,strokeLinecap:`round`,strokeLinejoin:`round`,xmlns:`http://www.w3.org/2000/svg`,children:[${4}(`path`,{d:`m3 11 18-5v12L3 14v-3z`}),${4}(`path`,{d:`M11.6 16.8a3 3 0 1 1-5.8-1.6`})]}),${4}(`span`,{children:`Banner`})]})})"
