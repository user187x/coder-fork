                    return await self._reject(writer, 403, "Forbidden")
                if len(self.clients) >= self.max_clients:
                    return await self._reject(writer, 503, "Too many subscribers")
    
                accept = base64.b64encode(hashlib.sha1((key + WS_GUID).encode()).digest()).decode()
                writer.write(
                    ("HTTP/1.1 101 Switching Protocols\r\nUpgrade: websocket\r\nConnection: Upgrade\r\n"
                     "Sec-WebSocket-Accept: %s\r\n\r\n" % accept).encode()
                )
                client = Client(writer, self.loop)
                self.clients.add(client)
                self.count = len(self.clients)
                if self.latest is None:
                    await self._refresh()
                self._send(client, frame(0x1, self.latest.encode()))  # catch up immediately
                sender = self.loop.create_task(self._sender(client))
                await self._receive(reader, client)
            except (asyncio.IncompleteReadError, ConnectionError, asyncio.CancelledError):
                pass
            except Exception as e:
                log(event="live-client-error", error=str(e))
            finally:
                if client is not None:
                    if not client.closing:  # ended by us or the peer politely: let a queued close frame go out first
                        try:
                            await asyncio.wait_for(client.queue.join(), 1)
                        except Exception:
                            pass
                    client.closing = True
                    self.clients.discard(client)
                    self.count = len(self.clients)
                if sender is not None:
                    sender.cancel()
                try:
                    writer.close()
                except Exception:
                    pass
    
        async def _sender(self, client):
            try:
                while True:
                    data = await client.queue.get()
                    client.writer.write(data)
                    await asyncio.wait_for(client.writer.drain(), 10)
                    client.queue.task_done()
            except Exception:
                self._drop(client, "write failed")
    
        async def _receive(self, reader, client):
            """Read frames the browser sends (pongs, pings, close). Anything else is ignored or refused."""
            while True:
                b1, b2 = await reader.readexactly(2)
                opcode = b1 & 0x0F
                length = b2 & 0x7F
                if length == 126:
                    length = int.from_bytes(await reader.readexactly(2), "big")
                elif length == 127:
                    length = int.from_bytes(await reader.readexactly(8), "big")
                if not b2 & 0x80:  # browsers must mask what they send (RFC 6455 5.1)
                    self._send(client, close_frame(1002, "unmasked frame"))
                    return
                if length > MAX_INBOUND:
                    self._send(client, close_frame(1009, "message too big"))
                    return
                mask = await reader.readexactly(4)
                payload = bytes(c ^ mask[i % 4] for i, c in enumerate(await reader.readexactly(length)))
                client.last_seen = self.loop.time()
                if opcode == 0x8:  # close: echo it and finish
                    self._send(client, close_frame(1000))
                    return
                if opcode == 0x9:  # ping -> pong
                    self._send(client, frame(0xA, payload))
                elif opcode not in (0x0, 0x1, 0x2, 0xA):
                    self._send(client, close_frame(1002, "unsupported opcode"))
                    return
    
  admin.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="robots" content="noindex">
      <title>Announcement banner · Coder admin</title>
      <link rel="stylesheet" href="/__banner/admin/app.css">
    </head>
    <body>
      <header class="topbar">
        <div class="topbar-inner">
          <h1>Announcement banner</h1>
          <div class="who"><a href="/">← Back to Coder</a><span id="who"></span></div>
        </div>
      </header>
    
      <main class="page">
        <section class="card" aria-labelledby="preview-h">
          <div class="card-head">
            <h2 id="preview-h">What developers see</h2>
            <span id="status" class="pill" role="status">Loading…</span>
          </div>
          <div class="preview-frame"><div id="preview"></div></div>
          <p class="hint" id="preview-note">Live preview of your draft below. Nothing is published until you press <b>Publish changes</b>.</p>
        </section>
    
        <section class="card" aria-labelledby="edit-h">
          <div class="card-head"><h2 id="edit-h">Message</h2></div>
    
          <div class="chips" role="group" aria-label="Start from a template">
            <span class="chips-label">Start from:</span>
            <button type="button" class="chip" data-preset="maintenance">Scheduled maintenance</button>
            <button type="button" class="chip chip-danger" data-preset="emergency">Emergency patch</button>
            <button type="button" class="chip" data-preset="clear">All clear</button>
          </div>
    
          <label class="field">
            <span class="label">Message <span class="count" id="count"></span></span>
            <textarea id="message" rows="3" maxlength="400" placeholder="What do developers need to know?"></textarea>
          </label>
    
          <fieldset class="field">
            <legend class="label">Style</legend>
            <div class="levels" id="levels">
              <label class="level level-info"><input type="radio" name="level" value="info"><span>Info</span></label>
              <label class="level level-success"><input type="radio" name="level" value="success"><span>Success</span></label>
              <label class="level level-warning"><input type="radio" name="level" value="warning"><span>Warning</span></label>
              <label class="level level-critical"><input type="radio" name="level" value="critical"><span>Critical</span></label>
            </div>
          </fieldset>
    
          <fieldset class="field">
            <legend class="label">Text effect</legend>
            <div class="effect-row">
              <select id="effect" aria-describedby="effect-hint">
                <option value="none" data-hint="Plain text, no animation.">None</option>
                <option value="typewriter" data-hint="Letters appear one by one, as if typed.">Typewriter</option>
                <option value="fade" data-hint="Words fade in one after another.">Fade in</option>
                <option value="rise" data-hint="Letters slide up into place.">Rise</option>
                <option value="wave" data-hint="A wave of movement runs through the letters.">Wave</option>
                <option value="bounce" data-hint="Letters drop in and bounce.">Bounce</option>
                <option value="flip" data-hint="Letters flip into view.">Flip</option>
                <option value="shake" data-hint="The whole message shakes: best kept for urgent notices.">Shake</option>
                <option value="pulse" data-hint="The message gently pulses.">Pulse</option>
                <option value="rainbow" data-hint="Colours sweep through the letters.">Rainbow</option>
              </select>
              <label class="check"><input id="repeat" type="checkbox"><span>Repeat continuously <small>(otherwise it plays once when the banner appears)</small></span></label>
              <button type="button" id="replay" class="btn">▶ Replay</button>
            </div>
            <p class="hint" id="effect-hint"></p>
          </fieldset>
    
          <div class="grid">
            <div class="field lead-field">
              <label class="label" for="title">Bold lead-in <em>(optional)</em></label>
              <div class="lead-row">
                <button type="button" id="emoji-btn" class="btn emoji-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="emoji-pop" aria-label="Insert an emoji" title="Insert an emoji">😀</button>
                <input id="title" type="text" maxlength="80" placeholder="e.g. Security patch:">
              </div>
              <div id="emoji-pop" class="emoji-pop" role="dialog" aria-label="Insert an emoji" hidden></div>
            </div>
            <label class="field"><span class="label">Link text <em>(optional)</em></span>
              <input id="linkText" type="text" maxlength="60" placeholder="e.g. Status page"></label>
            <label class="field grid-wide"><span class="label">Link address <em>(optional)</em></span>
              <input id="linkUrl" type="text" maxlength="500" placeholder="https://…"></label>
          </div>
    
          <div class="options">
            <label class="check"><input id="dismissible" type="checkbox"><span>Let people dismiss it <small>(untick for urgent notices)</small></span></label>
            <label class="check"><input id="showOnLoginPage" type="checkbox"><span>Also show on the sign-in page</span></label>
          </div>
    
          <details class="advanced">
            <summary>Advanced</summary>
            <label class="field inline"><span class="label">Open tabs check for changes every</span>
              <input id="refreshSeconds" type="number" min="15" max="3600" step="5"> <span>seconds</span></label>
            <p class="hint">Lower is faster to reach people who already have Coder open (minimum 15).</p>
          </details>
    
          <div id="problem" class="problem" role="alert" hidden></div>
    
          <div class="actions">
            <button type="button" id="publish" class="btn btn-primary" disabled>Publish changes</button>
            <button type="button" id="revert" class="btn" disabled>Discard edits</button>
            <span class="spacer"></span>
            <button type="button" id="toggle" class="btn">Hide banner</button>
          </div>
          <p class="hint" id="dirty" aria-live="polite"></p>
        </section>
    
        <section class="card card-emergency" aria-labelledby="emergency-h">
          <div class="card-head"><h2 id="emergency-h">Emergency: show it again</h2></div>
          <p>People who dismissed the banner will not see it again on their own. Use this when something urgent needs everyone's attention, for example a zero-day patch, so they can save their work.</p>
          <div class="actions">
            <button type="button" id="reappear" class="btn btn-danger">Show again to everyone</button>
          </div>
          <p class="hint" id="reappear-note"></p>
        </section>
    
        <section class="meta">
          <p id="meta"></p>
          <p><button type="button" id="reset" class="link" hidden>Discard everything published here and use the chart defaults</button></p>
        </section>
      </main>
    
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    
      <script src="/__banner/banner.js" data-preview></script>
      <script src="/__banner/admin/emoji-picker.js"></script>
      <script src="/__banner/admin/app.js"></script>
    </body>
    </html>
    
  app.js: |
    /* Coder banner admin page. All text from the server is inserted with textContent. */
    (function () {
      'use strict';
    
      var API = '/__banner/api/';
      var PRESETS = {
        maintenance: {
          level: 'warning', title: 'Scheduled maintenance:', dismissible: true,
          message: 'Coder will be unavailable on [date] from [start] to [end] UTC. Please save your work and stop your workspaces beforehand.',
        },
        emergency: {
          level: 'critical', title: 'Emergency security patch:', dismissible: false,
          message: 'Coder will restart at [time] UTC to apply a critical security fix. Save your work and push any code you need to keep now.',
        },
        clear: {
          level: 'success', title: 'All clear:', dismissible: true,
          message: 'Maintenance is complete and Coder is back to normal. Thanks for your patience.',
        },
      };
      var TEXT_FIELDS = ['message', 'title', 'linkText', 'linkUrl'];
      var BOOL_FIELDS = ['dismissible', 'showOnLoginPage', 'repeat'];
      var PLAY_DELAY_MS = 600; // let typing settle before (re)playing the effect in the preview
    
      var $ = function (id) { return document.getElementById(id); };
      var server = null; // last state from the service
      var busy = false;
      var toastTimer = null;
      var previewEl = null;
      var playTimer = null;
    
      function api(path, body) {
        var options = { credentials: 'same-origin', headers: {} };
        if (body !== undefined) {
          options.method = 'POST';
          options.headers = { 'Content-Type': 'application/json', 'X-Requested-With': 'coder-banner-admin' };
          options.body = JSON.stringify(body);
        }
        return fetch(API + path, options).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (data) {
            if (res.status === 401) {
              window.location.href = '/login?redirect=' + encodeURIComponent('/__banner/admin');
              return new Promise(function () {});
            }
            if (!res.ok) throw new Error(data.error || 'Request failed (HTTP ' + res.status + ')');
            return data;
          });
        });
      }
    
      // ---- form <-> banner
      function readForm() {
        var out = { enabled: server ? server.banner.enabled : true };
        TEXT_FIELDS.forEach(function (k) { out[k] = $(k).value.trim(); });
        BOOL_FIELDS.forEach(function (k) { out[k] = $(k).checked; });
        var level = document.querySelector('input[name=level]:checked');
        out.level = level ? level.value : 'info';
        out.effect = $('effect').value;
        out.refreshSeconds = parseInt($('refreshSeconds').value, 10) || 60;
        return out;
      }
    
      function writeForm(b) {
        TEXT_FIELDS.forEach(function (k) { $(k).value = b[k] || ''; });
        BOOL_FIELDS.forEach(function (k) { $(k).checked = !!b[k]; });
        var radio = document.querySelector('input[name=level][value=' + (b.level || 'info') + ']');
        if (radio) radio.checked = true;
        $('effect').value = b.effect || 'none';
        if (!$('effect').value) $('effect').value = 'none'; // an effect this page does not know about
        $('refreshSeconds').value = b.refreshSeconds || 60;
      }
    
      // A banner saved before effects existed has no effect fields: that means "none", not "changed".
      var EFFECT_DEFAULTS = { effect: 'none', repeat: false };
    
      function sameAsServer(form) {
        var s = server.banner;
        return TEXT_FIELDS.concat(BOOL_FIELDS, ['level', 'effect', 'refreshSeconds']).every(function (k) {
          return form[k] === (s[k] === undefined && k in EFFECT_DEFAULTS ? EFFECT_DEFAULTS[k] : s[k]);
        });
      }
    
      // ---- rendering
      // The preview text is redrawn on every keystroke; the effect is (re)played once typing settles.
      function playPreview() {
        window.clearTimeout(playTimer);
        if (previewEl && previewEl.isConnected) window.__coderBannerPreview.play(previewEl, readForm());
      }
    
      function renderEffectHint() {
        var option = $('effect').selectedOptions[0];
        var hint = option ? option.getAttribute('data-hint') : '';
        if (window.__coderBannerPreview.reducedMotion()) hint += ' This device asks for reduced motion, so effects are not played here, or for anyone with that setting.';
        $('effect-hint').textContent = hint;
        $('repeat').disabled = $('effect').value === 'none';
        $('replay').disabled = $('effect').value === 'none' || !previewEl;
      }
    
      function renderPreview() {
        var form = readForm();
        var box = $('preview');
        window.clearTimeout(playTimer);
        window.__coderBannerPreview.stop();
        previewEl = null;
        box.textContent = '';
        if (!form.message) {
          var empty = document.createElement('div');
          empty.className = 'preview-empty';
          empty.textContent = 'Type a message to see a preview.';
          box.appendChild(empty);
        } else {
          form.enabled = true;
          previewEl = window.__coderBannerPreview.build(form);
          box.appendChild(previewEl);
          if (form.effect !== 'none') playTimer = window.setTimeout(playPreview, PLAY_DELAY_MS);
        }
        renderEffectHint();
      }
    
      // "3 open tabs" - how many browsers are holding the live connection right now.
      function tabsText(prefix, suffix) {
        if (!server || typeof server.subscribers !== 'number') return '';
        return prefix + server.subscribers + ' open tab' + (server.subscribers === 1 ? '' : 's') + suffix;
      }
    
      function renderStatus() {
        var pill = $('status');
        var on = server.banner.enabled && !!server.banner.message;
        pill.textContent = on ? '● Live for all developers' + tabsText(' · ', ' connected') : '○ Hidden';
        pill.className = 'pill ' + (on ? 'live' : 'off');
        $('toggle').textContent = on ? 'Hide banner' : 'Show banner';
        $('reappear').disabled = !server.banner.message;
      }
    
      function renderState() {
        var form = readForm();
        var dirty = !sameAsServer(form);
        $('count').textContent = $('message').value.length + ' / 400';
        $('publish').disabled = busy || !dirty || !form.message;
        $('revert').disabled = busy || !dirty;
        $('toggle').disabled = busy;
        $('reappear').disabled = busy || !server.banner.message;
        $('reset').hidden = !server.overrideActive;
        var note = '';
        if (dirty) note = 'You have unpublished changes.';
        else if (/\[[^\]]+\]/.test(form.message)) note = 'Replace the [bracketed] parts of the message before publishing.';
        $('dirty').textContent = note;
        renderPreview();
      }
    
      function renderMeta() {
        var meta = $('meta');
        if (server.overrideActive && server.updatedBy) {
          meta.textContent = 'Last published by ' + server.updatedBy + ' on ' + new Date(server.updatedAt).toLocaleString() + '.';
        } else if (server.overrideActive) {
          meta.textContent = 'Published from this page.';
        } else {
          meta.textContent = 'Nothing has been published from this page yet, so the chart defaults are showing.';
        }
        var secs = server.banner.refreshSeconds;
        $('reappear-note').textContent = 'Tabs with a live connection' + tabsText(' (', ' right now)') + ' update instantly; any other open tab within about ' + secs +
          ' seconds; anyone who loads Coder afterwards sees it immediately.';
      }
    
      function apply(data, resetForm) {
        server = data;
        $('who').textContent = 'Signed in as ' + data.user.username;
        if (resetForm) writeForm(data.banner);
        renderStatus();
        renderMeta();
        renderState();
      }
    
      function toast(text, isError) {
        var el = $('toast');
        el.textContent = text;
        el.className = 'toast' + (isError ? ' error' : '');
        el.hidden = false;
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () { el.hidden = true; }, isError ? 8000 : 4000);
      }
    
      function showProblem(text) {
        var el = $('problem');
        el.textContent = text || '';
        el.hidden = !text;
      }
    
      // ---- actions
      function run(promise, success) {
        busy = true;
        showProblem('');
        renderState();
        return promise.then(function (data) {
          busy = false;
          apply(data, true);
          if (success) toast(success + (typeof data.delivered === 'number' ? ' Sent instantly to ' + data.delivered + ' open tab' + (data.delivered === 1 ? '' : 's') + '.' : ''));
        }).catch(function (e) {
          busy = false;
          renderState();
          showProblem(e.message);
          toast(e.message, true);
        });
      }
    
      function publish() {
        var form = readForm();
        if (/\[[^\]]+\]/.test(form.message) && !window.confirm('The message still contains [bracketed] placeholders. Publish it anyway?')) return;
        form.enabled = true;
        run(api('banner', form), 'Published. Developers will see the new message.');
      }
    
      function toggle() {
        var current = Object.assign({}, server.banner);
        current.enabled = !server.banner.enabled;
        if (current.enabled && !current.message) { showProblem('Write and publish a message first.'); return; }
        run(api('banner', current), current.enabled ? 'Banner is showing again.' : 'Banner hidden.');
      }
    
      function reappear() {
        var ok = window.confirm('Show the banner again to EVERYONE, including people who dismissed it?\n\nTabs with a live connection' + tabsText(' (', ' right now)') + ' will show it instantly; any other open tab within about ' + server.banner.refreshSeconds + ' seconds.');
        if (!ok) return;
        run(api('reappear', {}), 'Done. The banner will reappear for everyone, including people who dismissed it.');
      }
    
      function reset() {
        if (!window.confirm('Discard what was published from this page and go back to the chart defaults?')) return;
        run(api('reset', {}), 'Back to the chart defaults.');
      }
    
      function preset(name) {
        var p = PRESETS[name];
        var f = readForm();
        f.level = p.level; f.title = p.title; f.message = p.message; f.dismissible = p.dismissible;
        writeForm(f);
        renderState();
        $('message').focus();
      }
    
      function init() {
        ['input', 'change'].forEach(function (evt) {
          document.querySelector('main').addEventListener(evt, function (e) {
            if (e.target.closest('#preview') || !server) return;
            renderState();
          });
        });
        // The picker is a separate script; if it did not load, everything else still works (the button just does nothing).
        if (window.CoderBannerEmojiPicker) {
          window.CoderBannerEmojiPicker.init({ button: $('emoji-btn'), panel: $('emoji-pop'), fields: { message: $('message'), title: $('title') } });
        }
        $('replay').addEventListener('click', function () { renderPreview(); playPreview(); });
        $('publish').addEventListener('click', publish);
        $('revert').addEventListener('click', function () { writeForm(server.banner); showProblem(''); renderState(); });
        $('toggle').addEventListener('click', toggle);
        $('reappear').addEventListener('click', reappear);
        $('reset').addEventListener('click', reset);
        Array.prototype.forEach.call(document.querySelectorAll('[data-preset]'), function (b) {
          b.addEventListener('click', function () { preset(b.getAttribute('data-preset')); });
        });
        window.addEventListener('beforeunload', function (e) {
          if (server && !sameAsServer(readForm())) { e.preventDefault(); e.returnValue = ''; }
        });
        window.setInterval(function () {
          if (!server || document.hidden) return;
          api('state').then(function (data) {
            server.subscribers = data.subscribers;
            renderStatus();
            renderMeta();
          }).catch(function () { /* the next tick will try again */ });
        }, 15000);
        api('state').then(function (data) { apply(data, true); }).catch(function (e) {
          $('status').textContent = 'Error';
          showProblem(e.message);
        });
      }
    
      init();
    })();
    
  app.css: |
    :root {
      --bg: #f5f6f8; --card: #ffffff; --text: #1a1d23; --muted: #5b6472; --border: #d8dce3;
      --primary: #1e40af; --primary-text: #ffffff; --danger: #b91c1c; --focus: #2563eb;
      --ok: #166534; --off: #6b7280;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e1116; --card: #171b22; --text: #e8eaee; --muted: #9aa3b2; --border: #2b323d;
              --primary: #3b6fe0; --danger: #dc4b4b; --focus: #6ea0ff; --ok: #4ade80; --off: #8b93a1; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .topbar { background: var(--card); border-bottom: 1px solid var(--border); }
    .topbar-inner { max-width: 860px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 18px; margin: 0; }
    h2 { font-size: 15px; margin: 0; }
    .who { color: var(--muted); font-size: 13px; display: flex; gap: 14px; align-items: center; }
    .who a { color: inherit; }
    .page { max-width: 860px; margin: 0 auto; padding: 20px; display: grid; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .card-emergency { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
    .card-emergency h2 { color: var(--danger); }
    .card-emergency p { margin: 0 0 12px; }
    .pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .pill.live { color: var(--ok); border-color: currentColor; }
    .pill.off { color: var(--off); }
    .preview-frame { border: 1px dashed var(--border); border-radius: 8px; overflow: hidden; background: var(--bg); min-height: 44px; }
    .preview-empty { padding: 12px 20px; color: var(--muted); font-size: 14px; text-align: center; }
    .hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
    .field { display: block; margin: 0 0 14px; border: 0; padding: 0; min-width: 0; }
    .label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; }
    .label em { color: var(--muted); font-weight: 400; font-style: normal; }
    .count { float: right; color: var(--muted); font-weight: 400; }
    textarea, input[type=text], input[type=number] { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 7px; background: var(--card); color: var(--text); font: inherit; }
    input[type=number] { width: 90px; }
    textarea { resize: vertical; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
    .grid-wide { grid-column: 1 / -1; }
    @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
    .levels { display: flex; gap: 8px; flex-wrap: wrap; }
    .level input { position: absolute; opacity: 0; pointer-events: none; }
    .level span { display: inline-block; padding: 7px 16px; border-radius: 7px; border: 2px solid transparent; color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; opacity: .55; }
    .level input:checked + span { opacity: 1; border-color: var(--text); }
    .level input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
    .level-info span { background: #1e40af; } .level-success span { background: #166534; }
    .level-warning span { background: #b45309; } .level-critical span { background: #b91c1c; }
    .effect-row { display: flex; gap: 12px 18px; align-items: center; flex-wrap: wrap; }
    .effect-row .btn { padding: 6px 14px; }
    select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--card); color: var(--text); font: inherit; }
    .lead-field { position: relative; }
    .lead-row { display: flex; gap: 8px; align-items: stretch; }
    .lead-row input { flex: 1; min-width: 0; }
    .emoji-btn { padding: 4px 11px; font-size: 20px; line-height: 1.2; }
    .emoji-pop { position: absolute; left: 0; top: calc(100% + 4px); z-index: 30; width: min(392px, calc(100vw - 32px)); display: flex; flex-direction: column;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 32px rgba(0,0,0,.35); padding: 10px; gap: 8px; max-height: 440px; }
    .emoji-pop[hidden], .emoji-pop [hidden] { display: none !important; }  /* the flex/grid rules below must not defeat `hidden` */
    .emoji-top { display: grid; gap: 6px; }
    .emoji-search { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--card); color: var(--text); font: inherit; }
    .emoji-into { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
    .emoji-radio { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; color: var(--text); }
    .emoji-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .emoji-tab { flex: 1; font: inherit; font-size: 17px; padding: 3px 0; border: 0; border-radius: 6px; background: transparent; cursor: pointer; }
    .emoji-tab:hover, .emoji-tab:focus-visible { background: color-mix(in srgb, var(--primary) 20%, transparent); }
    .emoji-scroll { overflow-y: auto; min-height: 120px; flex: 1; position: relative; scroll-behavior: auto; }
    .emoji-sec { margin: 0 0 6px; }
    .emoji-h { position: sticky; top: 0; z-index: 1; margin: 0; padding: 4px 2px; background: var(--card); color: var(--muted); font-size: 12px; font-weight: 600; text-transform: none; }
    .emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 2px; }
    .emoji, .emoji-tab, .emoji-btn { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", "Segoe UI Symbol", sans-serif; }
    .emoji { font-size: 22px; line-height: 1; padding: 6px 0; border: 0; border-radius: 6px; background: transparent; cursor: pointer; }
    .emoji:hover, .emoji:focus-visible { background: color-mix(in srgb, var(--primary) 25%, transparent); }
    .emoji-none { margin: 14px 4px; color: var(--muted); font-size: 13px; }
    .emoji-foot { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 6px; min-height: 26px; }
    .emoji-name { color: var(--text); }
    .emoji-keys { text-align: right; }
    .chips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    .chips-label { color: var(--muted); font-size: 13px; }
    .chip { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
    .chip:hover { border-color: var(--primary); }
    .chip-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, var(--border)); }
    .options { display: grid; gap: 8px; margin: 4px 0 12px; }
    .check { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; }
    .check small { color: var(--muted); }
    .check input { margin-top: 4px; }
    .advanced { margin: 0 0 12px; }
    .advanced summary { cursor: pointer; color: var(--muted); font-size: 13px; }
    .field.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0 0; }
    .field.inline .label { margin: 0; }
    .problem { border: 1px solid var(--danger); color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, var(--card)); border-radius: 7px; padding: 9px 12px; margin-bottom: 12px; font-size: 14px; }
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .spacer { flex: 1; }
    .btn { font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 7px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
    .btn:hover:not(:disabled) { border-color: var(--text); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
    .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; font-size: 13px; }
    .meta { color: var(--muted); font-size: 13px; }
    .meta p { margin: 4px 0; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,.3); max-width: 90vw; }
    .toast.error { background: var(--danger); color: #fff; }
    
  emoji-picker.js: |
    /*
     * Emoji picker for the banner admin page: a button that opens a searchable panel and inserts the chosen emoji
     * into the message or the bold lead-in, at the cursor.
     *
     * No third-party code and nothing from outside this service: the emoji list is one script (emoji-data.js,
     * generated by support/build-emoji-data), fetched from the banner service the first time the panel opens.
     * Emoji are plain text, drawn by the operating system's emoji font. All text is set with textContent.
     */
    (function () {
      'use strict';
    
      var DATA_URL = '/__banner/admin/emoji-data.js';
      var RECENT_KEY = 'coder-banner-emoji-recent';
      var RECENT_MAX = 16;
      var SEARCH_MAX = 240;
      // Announcement favourites, by the name emoji-data.js gives them (looked up there, so a missing one is skipped).
      var QUICK = ['warning', 'police car light', 'check mark button', 'cross mark', 'red exclamation mark', 'information',
        'wrench', 'hammer and wrench', 'alarm clock', 'locked', 'fire', 'party popper', 'rocket'];
    
      var cfg = null; // { button, panel, fields: {message, title} }
      var data = null;
      var loading = null;
      var built = false;
      var target = 'message'; // which field receives the emoji: the one the admin used last
      var els = {};
      var recents = [];
    
      function make(tag, className, text) {
        var el = document.createElement(tag);
        if (className) el.className = className;
        if (text !== undefined) el.textContent = text;
        return el;
      }
    
      function loadData() {
        if (data) return Promise.resolve(data);
        if (!loading) {
          loading = new Promise(function (resolve, reject) {
            var tag = document.createElement('script');
            tag.src = DATA_URL;
            tag.onload = function () {
              if (window.CoderBannerEmoji && window.CoderBannerEmoji.emoji) resolve((data = window.CoderBannerEmoji));
              else reject(new Error('emoji list missing'));
            };
            tag.onerror = function () {
              reject(new Error('emoji list failed to load'));
            };
            document.head.appendChild(tag);
          });
          loading.catch(function () {
            loading = null; // allow another try
          });
        }
        return loading;
      }
    
      function readRecents() {
        try {
          var saved = JSON.parse(window.localStorage.getItem(RECENT_KEY) || '[]');
          recents = Array.isArray(saved) ? saved.filter(function (s) { return typeof s === 'string'; }).slice(0, RECENT_MAX) : [];
        } catch (e) {
          recents = [];
        }
      }
    
      function saveRecent(glyph) {
        recents = [glyph].concat(recents.filter(function (g) { return g !== glyph; })).slice(0, RECENT_MAX);
        try {
          window.localStorage.setItem(RECENT_KEY, JSON.stringify(recents));
        } catch (e) {
          /* private mode: recents just last for this visit */
        }
      }
    
      // ---- building the panel ---------------------------------------------------------------------------
      function emojiButton(row) {
        var b = make('button', 'emoji', row[1]);
        b.type = 'button';
        b.setAttribute('data-e', row[1]);
        b.setAttribute('data-name', row[2]);
        b.setAttribute('aria-label', row[2]);
        b.title = row[2];
        return b;
      }
    
      function fill(grid, rows) {
        grid.textContent = '';
        var frag = document.createDocumentFragment();
        rows.forEach(function (row) { frag.appendChild(emojiButton(row)); });
        grid.appendChild(frag);
      }
    
      function section(title, id) {
        var sec = make('section', 'emoji-sec');
        if (id) sec.id = id;
        sec.appendChild(make('h3', 'emoji-h', title));
        var grid = make('div', 'emoji-grid');
        sec.appendChild(grid);
        return { sec: sec, grid: grid };
      }
    
      function rowFor(glyph) {
        for (var i = 0; i < data.emoji.length; i++) if (data.emoji[i][1] === glyph) return data.emoji[i];
        return [0, glyph, glyph, ''];
      }
    
      function build() {
        var panel = cfg.panel;
        panel.textContent = '';
    
        var top = make('div', 'emoji-top');
        els.search = make('input', 'emoji-search');
        els.search.type = 'search';
        els.search.placeholder = 'Search emoji, e.g. warning, fire, rocket';
        els.search.setAttribute('aria-label', 'Search emoji');
        els.search.autocomplete = 'off';
        top.appendChild(els.search);
        var into = make('div', 'emoji-into');
        into.setAttribute('role', 'radiogroup');
        into.setAttribute('aria-label', 'Insert into');
        into.appendChild(make('span', 'emoji-into-label', 'Insert into:'));
        els.radios = {};
        [['message', 'Message'], ['title', 'Bold lead-in']].forEach(function (t) {
          var label = make('label', 'emoji-radio');
          var radio = make('input');
          radio.type = 'radio';
          radio.name = 'emoji-into';
          radio.value = t[0];
          els.radios[t[0]] = radio;
          label.appendChild(radio);
          label.appendChild(make('span', '', t[1]));
          into.appendChild(label);
        });
        top.appendChild(into);
        panel.appendChild(top);
    
        els.tabs = make('div', 'emoji-tabs');
        panel.appendChild(els.tabs);
    
        els.scroll = make('div', 'emoji-scroll');
        els.scroll.tabIndex = -1;
        var quick = section('Quick picks');
        var quickRows = QUICK.map(function (name) {
          for (var i = 0; i < data.emoji.length; i++) if (data.emoji[i][2] === name) return data.emoji[i];
          return null;
        }).filter(Boolean);
        fill(quick.grid, quickRows);
        els.scroll.appendChild(quick.sec);
        els.recent = section('Recently used');
        els.scroll.appendChild(els.recent.sec);
    
        var byGroup = data.groups.map(function () { return []; });
        data.emoji.forEach(function (row) { byGroup[row[0]].push(row); });
        els.sections = [];
        data.groups.forEach(function (name, i) {
          var sec = section(name.charAt(0).toUpperCase() + name.slice(1));
          fill(sec.grid, byGroup[i]);
          els.scroll.appendChild(sec.sec);
          els.sections.push(sec.sec);
          var tab = make('button', 'emoji-tab', byGroup[i].length ? byGroup[i][0][1] : '?');
          tab.type = 'button';
          tab.setAttribute('aria-label', 'Jump to ' + name);
          tab.title = name;
          tab.addEventListener('click', function () {
            els.scroll.scrollTop = sec.sec.offsetTop - els.scroll.offsetTop;
          });
          els.tabs.appendChild(tab);
        });
    
        els.results = section('Results');
        els.results.sec.hidden = true;
        els.scroll.appendChild(els.results.sec);
        els.none = make('p', 'emoji-none', 'No emoji match your search.');
        els.none.hidden = true;
        els.scroll.appendChild(els.none);
        panel.appendChild(els.scroll);
    
        var foot = make('div', 'emoji-foot');
        els.name = make('span', 'emoji-name');
        els.name.setAttribute('aria-live', 'polite');
        foot.appendChild(els.name);
        foot.appendChild(make('span', 'emoji-keys', 'Shift-click to add several · Esc to close'));
        panel.appendChild(foot);
        built = true;
        renderRecents();
        syncTarget();
      }
    
      function renderRecents() {
        fill(els.recent.grid, recents.map(rowFor));
        els.recent.sec.hidden = !recents.length;
      }
    
      function syncTarget() {
        if (built) els.radios[target].checked = true;
      }
    
      // ---- searching --------------------------------------------------------------------------------------
      function search() {
        var words = els.search.value.toLowerCase().split(/\s+/).filter(Boolean);
        var searching = words.length > 0;
        els.tabs.hidden = searching;
        els.results.sec.hidden = !searching;
        Array.prototype.forEach.call(els.scroll.children, function (child) {
          if (child !== els.results.sec && child !== els.none) child.hidden = searching || (child === els.recent.sec && !recents.length);
        });
        if (!searching) {
          els.none.hidden = true;
          return;
        }
        // Best matches first: the name is the query, then starts with it, then contains it, then only a keyword does.
        var query = words.join(' ');
        var hits = [];
        data.emoji.forEach(function (row, i) {
          var name = row[2].toLowerCase();
          var haystack = name + ' ' + row[3].toLowerCase();
          if (!words.every(function (w) { return haystack.indexOf(w) !== -1; })) return;
          var rank = name === query ? 0 : name.indexOf(query) === 0 ? 1 : name.indexOf(query) !== -1 ? 2 : 3;
          hits.push({ row: row, key: rank * 10000 + i });
        });
        hits = hits.sort(function (a, b) { return a.key - b.key; }).slice(0, SEARCH_MAX).map(function (h) { return h.row; });
        fill(els.results.grid, hits);
        els.results.sec.hidden = !hits.length;
        els.none.hidden = hits.length > 0;
        els.scroll.scrollTop = 0;
      }
    
      // ---- inserting ----------------------------------------------------------------------------------------
      function say(text) {
        els.name.textContent = text;
      }
    
      // Inserts at the cursor with a space on each side where one is needed, so "⚠️ Impending restart! ⚠️" needs no
      // fiddling. Returns false (and says why) when it would not fit the field's limit.
      function insert(glyph) {
        var field = cfg.fields[target];
        var max = Number(field.getAttribute('maxlength')) || Infinity;
        var start = typeof field.selectionStart === 'number' ? field.selectionStart : field.value.length;
        var end = typeof field.selectionEnd === 'number' ? field.selectionEnd : start;
        var before = field.value.slice(0, start);
        var after = field.value.slice(end);
        var add = (before && !/\s$/.test(before) ? ' ' : '') + glyph + (/^\s/.test(after) ? '' : ' ');
        if (before.length + add.length + after.length > max) {
          say('Not added: the ' + (target === 'title' ? 'bold lead-in' : 'message') + ' would be over its ' + max + ' character limit.');
          return false;
        }
        field.value = before + add + after;
        var caret = (before + add).length;
        field.setSelectionRange(caret, caret);
        field.dispatchEvent(new Event('input', { bubbles: true })); // the admin page refreshes its preview and "unpublished" state
        saveRecent(glyph);
        renderRecents();
        return true;
      }
    
      // ---- open / close / keyboard -----------------------------------------------------------------------------
      function isOpen() {
        return !cfg.panel.hidden;
      }
    
      function close(returnFocus) {
        if (!isOpen()) return;
        cfg.panel.hidden = true;
        cfg.button.setAttribute('aria-expanded', 'false');
        if (returnFocus) cfg.button.focus();
      }
    
      function open() {
        // Normally the last field you focused (tracked below); if the cursor is in one right now, that is the one.
        var active = document.activeElement;
        if (active === cfg.fields.message) target = 'message';
        else if (active === cfg.fields.title) target = 'title';
        syncTarget();
        cfg.button.setAttribute('aria-expanded', 'true');
        cfg.panel.hidden = false;
        if (built) {
          els.search.focus();
          return;
        }
        cfg.panel.textContent = 'Loading emoji…';
        loadData().then(
          function () {
            if (!built) build();
            if (isOpen()) els.search.focus();
          },
          function (e) {
            cfg.panel.textContent = 'Could not load the emoji list (' + e.message + '). Check that you are still signed in, then try again.';
          }
        );
      }
    
      function visibleEmoji() {
        return Array.prototype.filter.call(cfg.panel.querySelectorAll('.emoji'), function (b) {
          return b.offsetParent !== null;
        });
      }
    
      // Arrow keys move between emoji by position on screen (rows differ in length between sections).
      function move(from, key) {
        var list = visibleEmoji();
        var i = list.indexOf(from);
        var next = null;
        if (key === 'ArrowRight') next = list[i + 1];
        else if (key === 'ArrowLeft') next = list[i - 1];
        else {
          var r = from.getBoundingClientRect();
          var down = key === 'ArrowDown';
          var best = Infinity;
          list.forEach(function (b) {
            var q = b.getBoundingClientRect();
            var dy = down ? q.top - r.top : r.top - q.top;
            if (dy < 4) return;
            var score = dy * 1000 + Math.abs(q.left - r.left);
            if (score < best) {
              best = score;
              next = b;
            }
          });
        }
        if (next) {
          next.focus();
          next.scrollIntoView({ block: 'nearest' });
        }
      }
    
      function wire() {
        cfg.button.addEventListener('click', function () {
          if (isOpen()) close(false);
          else open();
        });
        cfg.panel.addEventListener('click', function (e) {
          var b = e.target.closest ? e.target.closest('.emoji') : null;
          if (!b) return;
          if (insert(b.getAttribute('data-e')) && !e.shiftKey) {
            close(false);
            cfg.fields[target].focus();
          }
        });
        cfg.panel.addEventListener('mouseover', function (e) {
          var b = e.target.closest ? e.target.closest('.emoji') : null;
          if (b) say(b.getAttribute('data-name'));
        });
        cfg.panel.addEventListener('focusin', function (e) {
          if (e.target.classList && e.target.classList.contains('emoji')) say(e.target.getAttribute('data-name'));
        });
        cfg.panel.addEventListener('input', function (e) {
          e.stopPropagation(); // typing in the search box is not an edit of the banner
          if (e.target === els.search) search();
        });
        cfg.panel.addEventListener('change', function (e) {
          e.stopPropagation();
          if (e.target.name === 'emoji-into') target = e.target.value;
        });
        cfg.panel.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') {
            e.preventDefault();
            e.stopPropagation();
            close(true);
          } else if (/^Arrow/.test(e.key) && e.target.classList && e.target.classList.contains('emoji')) {
            e.preventDefault();
            move(e.target, e.key);
          } else if (e.key === 'ArrowDown' && e.target === els.search) {
            var first = visibleEmoji()[0];
            if (first) {
              e.preventDefault();
              first.focus();
            }
          }
        });
        document.addEventListener('mousedown', function (e) {
          // Clicking into the message or lead-in (to place the cursor) keeps the panel open; anywhere else closes it.
          var inField = e.target === cfg.fields.message || e.target === cfg.fields.title;
          if (isOpen() && !inField && !cfg.panel.contains(e.target) && !cfg.button.contains(e.target)) close(false);
        });
        document.addEventListener('focusin', function (e) {
          var id = e.target && e.target.id;
          if (id === 'message' || id === 'title') {
            target = id;
            syncTarget();
          }
          if (isOpen() && !cfg.panel.contains(e.target) && !cfg.button.contains(e.target) && id !== 'message' && id !== 'title') close(false);
        });
      }
    
      window.CoderBannerEmojiPicker = {
        // button: opens the panel; panel: an empty hidden <div>; fields: { message, title } text inputs.
        init: function (options) {
          cfg = options;
          readRecents();
          cfg.panel.hidden = true;
          wire();
        },
      };
    })();
