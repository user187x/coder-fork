apiVersion: v1
kind: Service
metadata:
  name: coder-banner
  namespace: coder
  labels:
    app.kubernetes.io/name: coder-banner
    app.kubernetes.io/instance: coder-banner
    app.kubernetes.io/part-of: coder
    app.kubernetes.io/managed-by: kubectl
spec:
  selector:
    app.kubernetes.io/name: coder-banner
    app.kubernetes.io/instance: coder-banner
  ports:
    - name: http
      port: 80
      targetPort: http
    # WebSocket hub: pushes banner changes to every open Coder tab (see files/live.py).
    - name: live
      port: 8081
      targetPort: live
