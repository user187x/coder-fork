# The banner service may read and write exactly one ConfigMap: the one that holds what an admin published.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-banner
  namespace: coder
  labels:
    app.kubernetes.io/name: coder-banner
    app.kubernetes.io/instance: coder-banner
    app.kubernetes.io/part-of: coder
    app.kubernetes.io/managed-by: kubectl
