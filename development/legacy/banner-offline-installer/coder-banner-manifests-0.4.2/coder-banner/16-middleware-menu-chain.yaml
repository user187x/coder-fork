# 6. Ordered chain referenced by the HTTPRoute.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: coder-banner-menu
  namespace: coder
  labels:
    app.kubernetes.io/name: coder-banner
    app.kubernetes.io/instance: coder-banner
    app.kubernetes.io/part-of: coder
    app.kubernetes.io/managed-by: kubectl
spec:
  chain:
    middlewares:
      - name: coder-banner-compress
      - name: coder-banner-identity-encoding
      - name: coder-banner-menu-rewrite
