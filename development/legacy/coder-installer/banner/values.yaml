# The announcement banner (chart coder-banner 0.4.1, vendored here), installed as its own release coder-banner in
# Coder's namespace, with the values its Argo CD Application had:
#   helm upgrade --install coder-banner ./coder-banner-0.4.1.tgz -n coder -f values.yaml
admin:
  roles: [owner]
coder:
  host: coder.grey-marshall.com
  service:
    name: coder
    port: 80
gateway:
  name: traefik-gateway
  namespace: traefik
image:
  registry: harbor.grey-marshall.com
  repository: library/python
  tag: 3.13-alpine
