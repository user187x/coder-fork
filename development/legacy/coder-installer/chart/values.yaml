# coder-installer: Coder as it runs on the minikube cluster (2026-10-08). The defaults ARE that installation: install
# with no values besides the secrets (see ../README.md) and you get it back.
#
#   helm upgrade --install coder ./chart -n coder --create-namespace -f <backup>/secrets.values.yaml
#
# The address appears in several places, because Helm can't derive a subchart's values from this chart's: change
# coderHost / wildcardHost below AND the CODER_ACCESS_URL / CODER_WILDCARD_ACCESS_URL / CODER_NOTIFICATIONS_* /
# CODER_OIDC_ISSUER_URL env, coder.coder.httproute.host / wildcardHost, and coder.host in ../banner/values.yaml together.

coderHost: coder.grey-marshall.com
wildcardHost: "*.grey-marshall.com"

# The Traefik Gateway every route attaches to (Traefik v3 with the Gateway API provider), and the rewrite-body
# plugin's name in Traefik's static configuration (the dashboard add-ons rewrite Coder's pages with it).
gateway:
  name: traefik-gateway
  namespace: traefik
  sectionName: ""                   # one listener of the Gateway; empty = all of them
traefik:
  pluginName: rewrite-body

# ---------------------------------------------------------------------------------------------------------------------
# Secrets Coder and the add-ons read. Each is rendered only when its value is set here (../backup.sh writes them all to
# <backup>/secrets.values.yaml); otherwise create it yourself before installing. They are kept when the release is
# uninstalled (helm.sh/resource-policy: keep). Names are fixed: Coder's env and volumes below refer to them.
# ---------------------------------------------------------------------------------------------------------------------
secrets:
  # tls-wild-cert (kubernetes.io/tls): the wildcard certificate, mounted into Coder at /etc/ssl/certs/coder/...
  tlsCert: ""
  tlsKey: ""
  # tls-ca (key ca.crt): the CA Coder (CODER_TLS_CA_CERT), the add-on service and the workspace template push trust
  caCert: ""
  # keycloaking-coder-ca (key ca.crt): Keycloak's CA (SSL_CERT_DIR)
  keycloakCaCert: ""
  # keycloaking-coder-oidc (key client-secret): Coder's OIDC client secret in Keycloak (client "coder")
  oidcClientSecret: ""
  # coder-init-auth (keys email, password): the first owner; the template push signs in with it
  adminEmail: ""
  adminPassword: ""

# ---------------------------------------------------------------------------------------------------------------------
# Coder's database: a CloudNativePG Cluster (the operator must be installed; ../install.sh installs it when missing).
# CloudNativePG writes Secret <name>-app (key uri), which Coder reads. Kept when the release is uninstalled.
# ---------------------------------------------------------------------------------------------------------------------
postgres:
  enabled: true
  name: coder-db
  instances: 2
  primaryUpdateStrategy: unsupervised
  image: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  storage:
    size: 10Gi
    storageClass: standard-k8s

# ---------------------------------------------------------------------------------------------------------------------
# The dashboard add-on service (coder-ui-updates): the Python service at /__coder-ui/ (files/ui), the Traefik rewrites
# that put the add-ons into Coder's pages, the temporary log database for Monitoring, and its RBAC.
# ---------------------------------------------------------------------------------------------------------------------
uiUpdates:
  enabled: true
  image: harbor.grey-marshall.com/library/python:3.13-alpine
  # Coder's platform build (the forked image below) draws every add-on itself: nothing of Coder's is rewritten, only
  # /__coder-ui/ is routed (files/ui/httproute-native.yaml). false = the Traefik rewrites for an upstream Coder image.
  nativeDashboard: true
  adminRoles: [owner]
  hideSupportLinks: [Documentation, Star the repo, Join the Coder Discord, Report a bug]
  viewLabel: Announcement
  viewPath: announcement
  caSourceSecret: tls-ca
  oidcSecretName: keycloaking-coder-oidc
  # General > Keycloak: the namespace Keycloak runs in and its admin Secret (for automatic discovery)
  keycloakNamespace: keycloak
  keycloakAdminSecret: keycloak-initial-admin
  # The Argo CD Application whose helm.values General > Keycloak may edit. Empty here: that editor only understands
  # the coder chart's own value layout (coder.env), not this chart's (coder.coder.env), so it checks and reports, and
  # repairs Keycloak's side and the Secrets, but leaves Coder's settings to these values.
  argocd:
    namespace: argocd
    app: ""
  coderDB:
    secretName: coder-db-app
    secretKey: uri
    caSecretName: coder-db-ca
  logsDBImage: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  # The announcement banner is installed (release coder-banner, ../banner): the add-ons load it into Coder's pages
  # and embed its admin page in General > Announcement.
  banner: true
  storage:
    size: 1Gi                       # receipts, settings, chat, quota (SQLite)
    storageClass: standard          # the cluster's default class, which the volume got

# ---------------------------------------------------------------------------------------------------------------------
# Workspaces: the template a post-install Job pushes to Coder (files/workspace), and the icons its apps use (served at
# https://<coderHost>/__icons/). Workspaces run in the release namespace.
# ---------------------------------------------------------------------------------------------------------------------
workspaces:
  template:
    enabled: true
    name: ubuntu-vnc-desktop
    # The Job signs in with Secret coder-init-auth (an owner may use a password even with password sign-in off), or
    # uses a session token from this Secret (key token) when it exists. It also creates that first owner on an empty
    # database. A failed push never fails the install; restoring a backup brings the templates back anyway.
    tokenSecret: coder-workspace-push-token
    image: ghcr.io/user187x/coder-platform:2.0.0-platform.4   # any image with the coder CLI, curl and sh
    firstUsername: coder-admin      # the first owner, created only on an empty database
  icons:
    enabled: true
    image: nginxinc/nginx-unprivileged:1.30.5-alpine

# ---------------------------------------------------------------------------------------------------------------------
# Coder (the upstream coder chart 2.37.3) with the forked image: exactly the values of the coder Argo CD Application.
# The image is not on a public registry: ../install.sh loads it into minikube (see ../README.md).
# ---------------------------------------------------------------------------------------------------------------------
coder:
  coder:
    image:
      repo: ghcr.io/user187x/coder-platform
      tag: 2.0.0-platform.4
    env:
    # The platform build asks the add-on service (Health > User Quota) before creating a workspace
    - name: CODER_PLATFORM_SERVICE_ROUTES
      value: /__coder-ui=http://coder-ui-updates.coder.svc.cluster.local
    - name: CODER_BOOTSTRAP_INITIAL_USER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: coder-init-auth
          key: password
    - name: CODER_ACCESS_URL
      value: https://coder.grey-marshall.com
    - name: CODER_WILDCARD_ACCESS_URL
      value: '*.grey-marshall.com'
    - name: CODER_NOTIFICATIONS_METHOD
      value: 'webhook'
    - name: CODER_NOTIFICATIONS_WEBHOOK_ENDPOINT
      value: 'https://coder.grey-marshall.com/webhook'
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-db-app
          key: uri
    - name: CODER_TLS_CA_CERT
      value: /etc/ssl/certs/ca.crt
    - name: CODER_OIDC_ISSUER_URL
      value: https://keycloak.grey-marshall.com/realms/master
    - name: CODER_OIDC_CLIENT_ID
      value: coder
    - name: CODER_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: keycloaking-coder-oidc
          key: client-secret
    - name: CODER_OIDC_SCOPES
      value: openid,profile,email
    - name: CODER_OIDC_USERNAME_FIELD
      value: preferred_username
    - name: CODER_OIDC_EMAIL_FIELD
      value: email
    - name: CODER_OIDC_IGNORE_EMAIL_VERIFIED
      value: 'true'
    - name: CODER_OIDC_SIGN_IN_TEXT
      value: Sign in with your certificate
    - name: CODER_OIDC_ICON_URL
      value: /icon/keycloak.svg
    - name: CODER_OIDC_ALLOW_SIGNUPS
      value: 'true'
    - name: SSL_CERT_DIR
      value: /etc/ssl/certs:/etc/keycloaking/ca
    - name: CODER_DISABLE_PASSWORD_AUTH
      value: 'true'
    - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
      value: 'false'
    volumeMounts:
    - name: tls-coder-wildcard-tls
      mountPath: /etc/ssl/certs/coder/coder-wildcard-tls
      readOnly: true
    - name: ca-bundle
      mountPath: /etc/ssl/certs/ca.crt
      subPath: ca.crt
    - name: keycloaking-ca
      mountPath: /etc/keycloaking/ca
      readOnly: true
    volumes:
    - name: tls-coder-wildcard-tls
      secret:
        secretName: tls-wild-cert
    - name: ca-bundle
      secret:
        secretName: tls-ca
        items:
        - key: ca.crt
          path: ca.crt
    - name: keycloaking-ca
      secret:
        secretName: keycloaking-coder-ca
    service:
      type: ClusterIP
    httproute:
      enable: true
      host: coder.grey-marshall.com
      wildcardHost: '*.grey-marshall.com'
      parentRefs:
      - name: traefik-gateway
        namespace: traefik
        kind: Gateway
        group: gateway.networking.k8s.io
