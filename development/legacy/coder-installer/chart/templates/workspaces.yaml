{{- /*
The workspace template (files/workspace/*.tf) and the Job that pushes it to Coder, and the custom app icons the
template uses, served at https://<coderHost>/__icons/<file> by a small nginx (Coder's /icon/* set is built into the
server and coder_app.icon can't hold a data: URL). Same objects as the coder-workspace chart
(../../workspaces/workspace-chart) made on the cluster.
*/ -}}
{{- $ns := .Release.Namespace }}
{{- $w := .Values.workspaces }}
{{- if $w.template.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-workspace-terraform
  namespace: {{ $ns }}
  labels:
    {{- include "ci.labels" . | nindent 4 }}
data:
  # main.tf: the template. certificates.tf installs each user's PKCS#12 certificate (Settings > Certificates) as
  # ~/.cert/<username>.p12. agent-audit.tf records what runs in the workspace for Observability > Agent Activity.
  {{- range $path, $_ := .Files.Glob "files/workspace/*.tf" }}
  {{ base $path }}: {{ $.Files.Get $path | toJson }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: coder-workspace-push-template
  namespace: {{ $ns }}
  labels:
    {{- include "ci.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    # Kept for an hour so its log can be read; replaced by the next install or upgrade.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coder-workspace-push-template
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: coder-cli
          image: {{ $w.template.image }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              # Never fails the install: restoring a backup brings the templates back anyway.
              skip() { echo "Template not pushed: $*"; exit 0; }
              export CODER_URL={{ printf "http://%s.%s.svc.cluster.local" (include "ci.coderService" .) $ns | quote }}
              echo "Waiting for Coder at ${CODER_URL} ..."
              i=0
              until curl -fsS "${CODER_URL}/healthz" >/dev/null 2>&1; do
                i=$((i+1)); [ "$i" -ge 90 ] && skip "Coder did not answer within 15 minutes"
                sleep 10
              done
              if [ -z "${CODER_SESSION_TOKEN:-}" ]; then
                [ -n "${CODER_EMAIL:-}" ] && [ -n "${CODER_PASSWORD:-}" ] || skip "no token Secret and no Secret coder-init-auth"
                esc() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
                creds=$(printf '{"email":"%s","password":"%s"}' "$(esc "$CODER_EMAIL")" "$(esc "$CODER_PASSWORD")")
                # An empty database (no restore): the first owner is the coder-init-auth account.
                if [ "$(curl -s -o /dev/null -w '%{http_code}' "${CODER_URL}/api/v2/users/first")" = "404" ]; then
                  echo "Creating the first owner ${CODER_EMAIL} ..."
                  first=$(printf '{"email":"%s","password":"%s","username":"%s","name":"Coder Admin","trial":false}' \
                    "$(esc "$CODER_EMAIL")" "$(esc "$CODER_PASSWORD")" {{ $w.template.firstUsername | default "coder-admin" | quote }})
                  curl -fsS -X POST -H "Content-Type: application/json" -d "$first" "${CODER_URL}/api/v2/users/first" >/dev/null \
                    || skip "could not create the first owner"
                fi
                # Owners may sign in with a password even when password sign-in is off.
                CODER_SESSION_TOKEN=$(curl -sS -X POST -H "Content-Type: application/json" -d "$creds" \
                  "${CODER_URL}/api/v2/users/login" | sed -n 's/.*"session_token":"\([^"]*\)".*/\1/p')
                [ -n "$CODER_SESSION_TOKEN" ] || skip "signing in as ${CODER_EMAIL} failed"
              fi
              export CODER_SESSION_TOKEN
              dir=/tmp/workspace
              mkdir -p "$dir" && cp /tmp/tf-code/*.tf "$dir"/
              coder templates push {{ $w.template.name | quote }} \
                --directory "$dir" \
                --message "Deployed via Helm release {{ .Release.Name }}" \
                --variable namespace={{ $ns | quote }} \
                --yes || skip "coder templates push failed (above)"
          env:
            - name: HOME
              value: /tmp
            - name: CODER_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $w.template.tokenSecret | quote }}
                  key: token
                  optional: true
            - name: CODER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: coder-init-auth
                  key: email
                  optional: true
            - name: CODER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coder-init-auth
                  key: password
                  optional: true
          volumeMounts:
            - name: tf-code
              mountPath: /tmp/tf-code
      volumes:
        - name: tf-code
          configMap:
            name: coder-workspace-terraform
{{- end }}
{{- if $w.icons.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-workspace-icons
  namespace: {{ $ns }}
  labels:
    {{- include "ci.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/workspace/icons/*" }}
  {{ base $path }}: {{ $.Files.Get $path | toJson }}
  {{- end }}
  default.conf: |
    server {
      listen 8080;
      location /__icons/ {
        alias /usr/share/nginx/icons/;
        add_header Cache-Control "public, max-age=3600";
      }
      location / { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder-workspace-icons
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: coder-workspace-icons
    {{- include "ci.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coder-workspace-icons
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coder-workspace-icons
      annotations:
        checksum/icons: {{ .Files.Glob "files/workspace/icons/*" | toString | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: nginx
          image: {{ $w.icons.image }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /__icons/marimo.svg
              port: http
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: icons
              mountPath: /usr/share/nginx/icons
            - name: icons
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: icons
          configMap:
            name: coder-workspace-icons
---
apiVersion: v1
kind: Service
metadata:
  name: coder-workspace-icons
  namespace: {{ $ns }}
  labels:
    {{- include "ci.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: coder-workspace-icons
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder-workspace-icons
  namespace: {{ $ns }}
  labels:
    {{- include "ci.labels" . | nindent 4 }}
spec:
  hostnames:
    - {{ .Values.coderHost }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      {{- with .Values.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /__icons/
      backendRefs:
        - name: coder-workspace-icons
          port: 80
{{- end }}
