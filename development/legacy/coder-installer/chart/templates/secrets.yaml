{{- /*
The Secrets Coder and the add-ons read, rendered only when their values are set (../backup.sh writes them to
<backup>/secrets.values.yaml). Otherwise create them before installing; the chart then never touches them.
*/ -}}
{{- $s := .Values.secrets }}
{{- if and $s.tlsCert $s.tlsKey }}
apiVersion: v1
kind: Secret
metadata:
  name: tls-wild-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ci.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
stringData:
  tls.crt: |
    {{- $s.tlsCert | trim | nindent 4 }}
  tls.key: |
    {{- $s.tlsKey | trim | nindent 4 }}
---
{{- end }}
{{- with $s.caCert }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.uiUpdates.caSourceSecret | default "tls-ca" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ci.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ca.crt: |
    {{- . | trim | nindent 4 }}
---
{{- end }}
{{- with $s.keycloakCaCert }}
apiVersion: v1
kind: Secret
metadata:
  name: keycloaking-coder-ca
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ci.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ca.crt: |
    {{- . | trim | nindent 4 }}
---
{{- end }}
{{- with $s.oidcClientSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.uiUpdates.oidcSecretName | default "keycloaking-coder-oidc" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ci.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  client-secret: {{ . | quote }}
---
{{- end }}
{{- if and $s.adminEmail $s.adminPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: coder-init-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ci.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  email: {{ $s.adminEmail | quote }}
  password: {{ $s.adminPassword | quote }}
{{- end }}
