# The temporary log database for Monitoring: a plain PostgreSQL on an emptyDir (gone when the pod goes, which is
# fine: it only buffers the last 5 MB of each watched workspace's log). It runs the same PostgreSQL image as Coder's
# CloudNativePG cluster, so nothing new is pulled; the password comes from Secret coder-ui-logs-db (made by the script).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder-ui-logs-db
  namespace: @@NAMESPACE@@
  labels: @@LABELS@@
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: coder-ui-logs-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coder-ui-logs-db
        app.kubernetes.io/part-of: coder
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: @@LOGS_DB_IMAGE@@
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n1)
              if [ ! -s /data/pg/PG_VERSION ]; then
                printf '%s' "$POSTGRES_PASSWORD" > /tmp/pw
                "$BIN/initdb" -D /data/pg -U logs --auth-local=trust --auth-host=scram-sha-256 --pwfile=/tmp/pw -E UTF8 >/dev/null
                rm -f /tmp/pw
                echo "host all all 0.0.0.0/0 scram-sha-256" >> /data/pg/pg_hba.conf
                echo "CREATE DATABASE logs;" | "$BIN/postgres" --single -D /data/pg postgres >/dev/null
              fi
              exec "$BIN/postgres" -D /data/pg -c listen_addresses='*' -c unix_socket_directories=/tmp \
                -c max_connections=30 -c shared_buffers=32MB -c fsync=off -c synchronous_commit=off \
                -c full_page_writes=off -c log_min_messages=warning
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: coder-ui-logs-db, key: password}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: coder-ui-logs-db
  namespace: @@NAMESPACE@@
  labels: @@LABELS@@
spec:
  selector:
    app.kubernetes.io/name: coder-ui-logs-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
