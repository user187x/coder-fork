<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cluster Network · Coder</title>
  <link rel="stylesheet" href="/__coder-ui/view.css">
  <link rel="stylesheet" href="/__coder-ui/network.css">
  <style id="coder-ui-theme"></style>
</head>
<body>
<main>
  <section class="card" aria-labelledby="map-h">
    <div class="card-head">
      <h2 id="map-h">Cluster map</h2>
      <div class="row">
        <span class="live" id="live"><span class="dot" aria-hidden="true"></span><span id="updated">Loading…</span></span>
        <button type="button" class="btn btn-small" id="pause" aria-pressed="false">Pause</button>
      </div>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="topology" id="topology">
      <svg class="links" id="links" aria-hidden="true"></svg>
      <div class="entry" id="entry"></div>
      <div class="nodes" id="nodes"></div>
    </div>
    <div class="legend" id="legend">
      <span><i class="chip-key coder"></i>Coder server</span>
      <span><i class="chip-key database"></i>Database</span>
      <span><i class="chip-key add-on"></i>Add-on</span>
      <span><i class="chip-key workspace"></i>Workspace</span>
      <span><i class="line-key ok"></i>Agent connected</span>
      <span><i class="line-key bad"></i>Agent not connected</span>
    </div>
    <p class="hint" id="error" hidden></p>
  </section>

  <section class="card" aria-labelledby="ws-h">
    <div class="card-head"><h2 id="ws-h">Workspaces by node</h2><span class="hint" id="ws-count"></span></div>
    <div class="scroll"><table id="ws-table">
      <thead><tr><th>Workspace</th><th>Owner</th><th>Template</th><th>Node</th><th>Pod IP</th><th>Agent</th><th>Latency</th><th>Restarts</th><th>Running since</th></tr></thead>
      <tbody></tbody>
    </table></div>
    <p class="hint" id="unplaced" hidden></p>
  </section>

  <section class="card" aria-labelledby="nodes-h">
    <div class="card-head"><h2 id="nodes-h">Nodes</h2><span class="hint" id="nodes-count"></span></div>
    <div class="scroll"><table id="node-table">
      <thead><tr><th>Node</th><th>Status</th><th>Roles</th><th>Internal IP</th><th>External IP</th><th>Pod CIDR</th><th>CPU</th><th>Memory</th><th>Pods</th><th>Kubelet</th><th>OS / kernel</th><th>Runtime</th><th>Taints</th><th>Age</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/__coder-ui/network-view.js"></script>
</body>
</html>
