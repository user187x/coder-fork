# Overrides for an air-gapped EKS cluster (plain Helm / ./install.sh). For Argo CD use
# argocd/coder-airgapped-application.yaml instead; it carries the same values.
#
# Copy to my-values.yaml, replace every CHANGE-ME, then:
#   ./install.sh -f my-values.yaml --ca ca.crt --oidc-ca oidc-ca.crt --oidc-secret-file oidc-client-secret.txt \
#                --tls-crt wildcard.crt --tls-key wildcard.key
#
# `global` drives every component (all chart values are documented in coder-airgapped/values.yaml).

global:
  domain: example.com                                     # CHANGE-ME: Coder at https://coder.example.com, apps at *.example.com
  coderHost: ""                                           # "" = coder.<domain>
  wildcardHost: ""                                        # "" = *.<domain>
  registry: 123456789012.dkr.ecr.us-east-1.amazonaws.com  # CHANGE-ME: where ./mirror-images.sh push put the images
  imagePullSecrets: []                                    # EKS + ECR: none (node role)
  gateway:
    name: traefik-gateway
    namespace: traefik
  oidc:
    issuerUrl: https://keycloak.example.com/realms/master # CHANGE-ME
    clientId: coder
  firstUser:
    username: admin                                       # CHANGE-ME
    email: ""                                             # "" = <username>@<domain>
  secretNames:                                            # rename here and pass --secret-name KEY=NAME to install.sh
    tlsCa: tls-ca
    oidcCa: keycloaking-coder-ca
    oidcClient: keycloaking-coder-oidc
    wildcardTls: tls-wild-cert

coder:
  coder:
    # Air gap: no telemetry, no update check, no public STUN (appended to the chart's environment).
    extraEnv:
    - name: CODER_TELEMETRY_ENABLE
      value: "false"
    - name: CODER_UPDATE_CHECK
      value: "false"
    - name: CODER_DERP_SERVER_STUN_ADDRESSES
      value: "disable"

database:
  storage:
    storageClass: gp3                                     # CHANGE-ME (EBS CSI StorageClass)

uiUpdates:
  persistence:
    storageClass: gp3                                     # CHANGE-ME
  # Keycloak on another cluster (hub/spoke): there is no Keycloak namespace here.
  keycloak:
    enabled: false
  # Installed with Helm, not Argo CD.
  argocd:
    enabled: false
