# Workspaces, the template push and every resource of this chart live here. The template accepts only "coder".
namespace: "coder"

# Prefix of every object name (<prefix>-terraform, <prefix>-icons, <prefix>-push-template). Empty = the release name.
namePrefix: ""

coder:
  url: "https://coder.grey-marshall.com"
  # Secret (in `namespace`, key "token") with a Coder session token for the template push. install-workspace-chart
  # creates it for the install and deletes it afterwards. Without it the Job logs in with Secret coder-init-auth.
  tokenSecret: "coder-workspace-push-token"
  # URL the push Job uses instead of `url` (e.g. the in-cluster Service, so the push needs no Gateway or DNS).
  internalUrl: ""

# Image of the template-push Job's coder CLI.
cliImage: "ghcr.io/user187x/coder-platform:2.0.0-platform.29-airgap"
# Any image with python3: signs in with coder-init-auth when there is no token Secret.
loginImage: "docker.io/library/python:3.13-alpine"

# Container image of the workspace pods, substituted for "codercom/enterprise-base:ubuntu" in files/main.tf.
workspaceImage: "ghcr.io/user187x/coder-workspace:1.8.3"
# StorageClass of workspaces' home volumes ("" = the cluster's default; EKS may have none: e.g. gp3). New volumes only.
storageClass: ""

imagePullSecrets: []    # e.g. [{name: registry-pull}], for the push Job and the icons Deployment

# Secrets the template and the push Job read (they must exist in `namespace`).
secrets:
  tlsCa: tls-ca              # key ca.crt; also substituted for "tls-ca" in files/main.tf (workspace trust store)
  initAuth: coder-init-auth  # keys email, password: the push Job's sign-in when there is no token Secret

template:
  name: "ubuntu-vnc-desktop"      # the template's name (its URL: /templates/<name>); a rename in the dashboard is followed
  # Shown in the dashboard instead of the name, and its icon (one of Coder's, /icon/*.svg). Set when the template has
  # none: on a new install, or on a template that never had one. A display name or icon set in the dashboard is kept.
  displayName: "UBUNTU"
  icon: "/icon/ubuntu.svg"

# Add files/agent-audit.tf (Observability > Agent Activity: every command run in a workspace) to the template.
# Off by default: the reference cluster's active template is main.tf + certificates.tf only.
agentAudit: false

# Custom app icons (files/icons/*), served at https://<host>/__icons/<file> (templates/icons.yaml)
icons:
  host: ""            # default: coder.url without https://
  # The Service that serves files/icons/ (mounted from the ConfigMap below) at /__icons/<file>. In coder-airgapped
  # that is the platform service, coder-ui-updates.
  backend:
    name: coder-ui-updates
    port: 80
  gateway:
    name: traefik-gateway
    namespace: traefik
