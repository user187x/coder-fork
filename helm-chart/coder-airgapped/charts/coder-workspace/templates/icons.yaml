{{- include "coder-workspace.platform.values" . -}}
{{- /*
Custom app icons for the workspace template, served at https://<coder host>/__icons/<file>.
Coder's own /icon/* set is built into the server and coder_app.icon is limited to 256 characters
(no inline data: URLs), so the files in files/icons/ go into this ConfigMap and Traefik routes /__icons/ to the
Service in icons.backend - in coder-airgapped the platform service (coder-ui-updates), which mounts the ConfigMap
and serves the files. No separate web server.
The HTTPRoute below is separate from Coder's own routes and only matches /__icons/.
*/ -}}
{{- $ns := .Values.namespace | default "coder" }}
{{- $name := printf "%s-icons" (include "coder-workspace.prefix" .) }}
{{- $host := .Values.icons.host | default (trimPrefix "https://" .Values.coder.url) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
data:
  {{- range $path, $_ := .Files.Glob "files/icons/*" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
spec:
  hostnames:
    - {{ $host }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.icons.gateway.name }}
      namespace: {{ .Values.icons.gateway.namespace }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /__icons/
      backendRefs:
        - name: {{ .Values.icons.backend.name }}
          port: {{ .Values.icons.backend.port }}
