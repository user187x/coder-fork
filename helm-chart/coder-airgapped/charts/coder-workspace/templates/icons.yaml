{{- include "coder-workspace.platform.values" . -}}
{{- /*
Custom app icons for the workspace template, served at https://<coder host>/__icons/<file>.
Coder's own /icon/* set is built into the server and coder_app.icon is limited to 256 characters
(no inline data: URLs), so the files in files/icons/ are served by a tiny nginx on Coder's hostname.
The HTTPRoute below is separate from Coder's own routes and only matches /__icons/.
*/ -}}
{{- $ns := .Values.namespace | default "coder" }}
{{- $name := printf "%s-icons" (include "coder-workspace.prefix" .) }}
{{- $host := .Values.icons.host | default (trimPrefix "https://" .Values.coder.url) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
data:
  {{- range $path, $_ := .Files.Glob "files/icons/*" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
  default.conf: |
    server {
      listen 8080;
      location /__icons/ {
        alias /usr/share/nginx/icons/;
        add_header Cache-Control "public, max-age=3600";
      }
      location / { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
      annotations:
        checksum/icons: {{ .Files.Glob "files/icons/*" | toString | sha256sum | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: nginx
          image: {{ .Values.icons.image }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /__icons/marimo.svg
              port: http
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: icons
              mountPath: /usr/share/nginx/icons
            - name: icons
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: icons
          configMap:
            name: {{ $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
spec:
  hostnames:
    - {{ $host }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.icons.gateway.name }}
      namespace: {{ .Values.icons.gateway.namespace }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /__icons/
      backendRefs:
        - name: {{ $name }}
          port: 80
