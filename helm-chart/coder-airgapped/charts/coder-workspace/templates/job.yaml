{{- include "coder-workspace.platform.values" . -}}
{{- $url := .Values.coder.internalUrl | default (required "CODER_URL must be provided!" .Values.coder.url) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "coder-workspace.prefix" . }}-push-template
  namespace: {{ .Values.namespace | default "coder" }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # Removed once it has pushed the template; a failed run stays for its logs until the next install, or an hour.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The session token comes from a Secret (install-workspace-chart creates it for the duration of the install),
      # never from Helm values: those are stored in the release record. Without that Secret this init container
      # signs in with coder-init-auth. (0.1.0 did that with curl + jq in the coder image, which has neither.)
      initContainers:
        - name: login
          image: {{ .Values.loginImage }}
          command: ["python3", "-c"]
          args:
            - |
              import json, os, ssl, sys, urllib.request
              base = os.environ["CODER_URL"].rstrip("/")
              ctx = ssl.create_default_context(cafile="/etc/ssl/certs/coder/ca.crt") if os.path.exists("/etc/ssl/certs/coder/ca.crt") else None
              token = os.environ.get("CODER_SESSION_TOKEN")
              if not token:
                  print("No token Secret. Logging in with coder-init-auth...")
                  body = json.dumps({"email": os.environ.get("CODER_EMAIL", ""), "password": os.environ.get("CODER_PASSWORD", "")}).encode()
                  req = urllib.request.Request(base + "/api/v2/users/login", data=body,
                                               method="POST", headers={"Content-Type": "application/json"})
                  try:
                      token = json.load(urllib.request.urlopen(req, timeout=30, context=ctx)).get("session_token")
                  except Exception as e:
                      sys.exit(f"Authentication failed: {e}")
                  if not token:
                      sys.exit("Authentication failed.")
              open("/shared/token", "w").write(token)

              # The template to push to: the configured name, or, when it was renamed in the dashboard, the template
              # this release deployed (its versions' message), under its new name. Without this a rename made the
              # next install create a second, empty template, leaving the workspaces and their history on the first.
              name = os.environ["TEMPLATE_NAME"]
              mark = os.environ["PUSH_MESSAGE"]
              def get(path):
                  r = urllib.request.Request(base + path, headers={"Coder-Session-Token": token})
                  return json.load(urllib.request.urlopen(r, timeout=30, context=ctx))
              try:
                  templates = get("/api/v2/templates")
                  if not any(t["name"] == name for t in templates):
                      ours = [t for t in templates
                              if any((v.get("message") or "") == mark for v in get("/api/v2/templates/%s/versions" % t["id"]))]
                      if len(ours) == 1:
                          print(f"The template {name} was renamed to {ours[0]['name']} in the dashboard: pushing to it.")
                          name = ours[0]["name"]
                      elif len(ours) > 1:
                          print("More than one template holds this release's versions (%s): creating %s."
                                % (", ".join(t["name"] for t in ours), name))
              except Exception as e:
                  print(f"Could not look for a renamed template ({e}): pushing to {name}.")
              open("/shared/template", "w").write(name)
          env:
            - name: CODER_URL
              value: {{ $url | quote }}
            - name: TEMPLATE_NAME
              value: {{ .Values.template.name | quote }}
            - name: PUSH_MESSAGE
              value: {{ printf "Deployed via Helm release %s" .Release.Name | quote }}
            - name: CODER_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.coder.tokenSecret | quote }}
                  key: token
                  optional: true
            - name: CODER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.initAuth | quote }}
                  key: email
                  optional: true
            - name: CODER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.initAuth | quote }}
                  key: password
                  optional: true
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: tls-ca
              mountPath: /etc/ssl/certs/coder
              readOnly: true
      containers:
        - name: coder-cli
          image: {{ .Values.cliImage }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              CODER_URL={{ $url | quote }}
              CODER_SESSION_TOKEN="$(cat /shared/token)"

              export CODER_SESSION_TOKEN
              export CODER_URL
              export SSL_CERT_FILE="/etc/ssl/certs/coder/ca.crt"
              export WORKSPACE="/tmp/workspace"

              # Create the target workspace directory
              mkdir -p "${WORKSPACE}"

              # Copy the ConfigMap's files (main.tf, certificates.tf, agent-audit.tf) as physical files
              cp /tmp/tf-code/*.tf "${WORKSPACE}"/

              # Push the physical directory
              # The configured name, or the template it was renamed to (the login step looks it up)
              TEMPLATE="$(cat /shared/template)"
              coder templates push "${TEMPLATE}" \
                --directory "${WORKSPACE}" \
                --message "Deployed via Helm release {{ .Release.Name }}" \
                --variable namespace="{{ .Values.namespace | default "coder" }}" \
                --variable home_storage_class="{{ .Values.storageClass | default "" }}" \
                {{- with .Values.global.clusterAccess }}{{ if .enabled }}
                --variable cluster_oidc_issuer="{{ $.Values.global.oidc.issuerUrl | default (printf "https://keycloak.%s/realms/master" $.Values.global.domain) }}" \
                --variable cluster_oidc_client_id="{{ .clientId }}" \
                --variable cluster_admin_roles="{{ .adminRoles }}" \
                {{- end }}{{ end }}
                --yes
          volumeMounts:
            - name: shared
              mountPath: /shared
              readOnly: true
            - name: tf-code
              mountPath: /tmp/tf-code
            - name: tls-ca
              mountPath: /etc/ssl/certs/coder
              readOnly: true
      restartPolicy: Never
      volumes:
        - name: shared
          emptyDir:
            medium: Memory
        - name: tf-code
          configMap:
            name: {{ include "coder-workspace.prefix" . }}-terraform
        - name: tls-ca
          secret:
            secretName: {{ .Values.secrets.tlsCa | quote }}
