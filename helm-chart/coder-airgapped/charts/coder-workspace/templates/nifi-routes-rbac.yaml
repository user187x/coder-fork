{{- include "coder-workspace.platform.values" . -}}
{{- /*
The dataflow template's NiFi route (files/main.tf: kubernetes_manifest nifi_route): Coder's provisioner, which runs
as Coder's service account, creates each dataflow workspace's HTTPRoute in this namespace and deletes it with the
workspace: HTTPRoutes in this namespace, and reading the cluster's CRDs, where Terraform's kubernetes_manifest looks up
the HTTPRoute's type before it plans (definitions only, no custom resources).
*/ -}}
{{- if .Values.dataflowTemplate.enabled }}
{{- $ns := .Values.namespace | default "coder" }}
{{- $name := printf "%s-nifi-routes" (include "coder-workspace.prefix" .) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.nifiRoute.coderServiceAccount }}
    namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-{{ $ns }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-{{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-{{ $ns }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.nifiRoute.coderServiceAccount }}
    namespace: {{ $ns }}
{{- end }}
