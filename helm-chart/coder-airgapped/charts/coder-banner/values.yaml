# Namespace of the Coder release (Middleware/HTTPRoute must live next to the Coder Service).
namespace: ""   # defaults to the release namespace (helm -n <coder namespace> / Argo CD destination)

coder:
  host: coder.grey-marshall.com
  service:
    name: coder
    port: 80

gateway:
  name: traefik-gateway
  namespace: traefik
  # The Gateway listener the banner route attaches to (parentRefs[].sectionName). Empty = EVERY listener of the Gateway,
  # which is how Coder's own route is usually attached. Set it to the HTTPS listener (e.g. "https") when the Gateway also
  # has a plain-HTTP listener with an HTTP->HTTPS redirect route: the banner rule is more specific than a redirect rule
  # (it has a header match), so on a listener both attach to it would answer HTML page loads instead of redirecting.
  # ./banner-guide suggests the value from Coder's own route and the Gateway's listeners.
  sectionName: ""

plugin:
  # Must match the key under `experimental.plugins` in Traefik's static config
  # (see ../traefik-plugin/rewrite-body-plugin.yaml).
  name: rewrite-body

# Path prefixes that are never rewritten. Workspace apps (code-server, noVNC, ...) serve their
# own HTML under /@user/workspace.agent/apps/..., so they bypass the middleware entirely.
passthroughPathPrefixes:
  - /@

# The banner service: serves the loader script, the live banner.json and the admin page. Standard-library
# Python (3.8 or newer) whose code is mounted from a ConfigMap, so there is no custom image to build - any
# image with `python3` works. In an air-gapped cluster point this at your internal registry, e.g.
#   --set image.registry=registry.internal:5000 --set image.repository=library/python
image:
  registry: docker.io
  repository: library/python
  tag: 3.13-alpine
  digest: ""            # optional "sha256:..." - when set it is used instead of the tag
  pullPolicy: IfNotPresent
imagePullSecrets: []    # e.g. [{name: internal-registry}]
nodeSelector: {}        # e.g. {kubernetes.io/arch: amd64} when the image is single-architecture
# Replicas. More than one keeps the banner up while a node is drained or lost (they spread over nodes and zones). Each
# re-reads the stored banner every few seconds, so one published through a replica reaches the others' tabs within
# about 15 seconds.
replicaCount: 1

# Live push: open Coder tabs hold a WebSocket to the banner service, so a published banner appears at once
# (without it tabs poll every banner.refreshSeconds). One replica holds thousands of idle tabs cheaply.
live:
  enabled: true
  maxConnections: 5000       # further tabs are refused with 503 and fall back to polling
  heartbeatSeconds: 20       # tabs treat 3 missed heartbeats as a dead connection and reconnect

admin:
  # Coder roles allowed to use https://<coder.host>/__banner/admin. Admins sign in with their normal
  # Coder session; there are no separate accounts.
  roles:
    - owner

# Replace the "Codernauts" item in Coder's user menu with a link to the admin page. The dashboard is
# client-rendered, so this rewrites Coder's JavaScript bundle with a second rewrite-body middleware.
menu:
  enabled: true
  label: Banner
  # Only users holding one of admin.roles see the item (the admin page enforces this regardless).
  adminOnly: true

# ---- Chart defaults for the banner. These show until an admin publishes something from the admin page
# (https://<coder.host>/__banner/admin); after that the admin page wins until it is reset. ----
banner:
  enabled: true
  level: info            # info | success | warning | critical
  title: ""              # optional bold lead-in
  message: "Scheduled maintenance: Coder will be briefly unavailable this Saturday from 02:00 to 03:00 UTC."
  linkText: ""           # optional link, shown after the message
  linkUrl: ""            # http(s):// or /path
  dismissible: true
  # Users who dismissed the banner see it again when this changes. Empty = derived from the
  # level/title/message/link, so editing the text re-shows it automatically.
  id: ""
  # Coder's login page has no header to anchor under, so show the banner above the page instead.
  showOnLoginPage: true
  refreshSeconds: 60     # how often open browser tabs re-check banner.json (min 15)
  # Text effect (bundled in the chart - nothing is downloaded). Browsers whose user asked for reduced motion always
  # see plain text.
  #   none | typewriter | fade | rise | wave | bounce | flip | shake | pulse | rainbow
  #   starwars (the message rising within the banner: a flat scroller or the opening crawl, crawlTilt) | pewpew (letters fired in as laser bolts) | flap (split-flap board)
  #   shimmer (a light sweeping muted letters) | kitt (Knight Rider's scanner behind the message)
  effect: none
  repeat: false          # true = keep repeating; false = play once each time the banner appears
  speed: normal          # slow | normal | fast: the Knight Rider scanner's sweep
  crawlSpeed: 15         # starwars: how fast the message rises, in pixels a second (4-60)
  crawlTilt: 100         # starwars: how far its lines converge towards a horizon, percent: 0 a flat scroller, 100 the opening crawl
  font: default          # default | sans | serif | condensed | geist-mono | ibm-plex-mono | jetbrains-mono | fira-code | source-code-pro
  align: center          # left | center | right
  # The message is Markdown (the dashboard's editor writes plain text and sets this to false).
  markdown: true
  # The banner's background picture: a same-site path (/...) or an http(s) URL; "" none. An announcement may be only a
  # picture. pictureFit: span (as wide as the banner, rolling through it) | center | tile | fill | stretch
  picture: ""
  pictureFit: span
  outline: false         # the message ringed in a contrasting colour, to stay legible over any picture
  # A countdown shown as a clock at the banner's left: a UTC time such as 2026-10-20T18:00:00Z; "" none.
  countdown: ""
  # Who viewed the announcement is recorded and they can confirm it (the dashboard's Viewed box and Confirm).
  receipts: true
  # How the dashboard brings the banner in, and takes it away when someone dismisses it.
  openEffect: none       # none | fade | rolldown | kitt | crt | glitch
  closeEffect: fade      # none | pixelate | rollup | fade | wipe | matrix | gaussian | evaporate | kitt
