{{- include "coder-banner.platform.values" . -}}
{{- $b := .Values.banner -}}
{{- /* The free-form values, checked as the service checks what admins publish (files/server.py clean()). */ -}}
{{- $safeUrl := "^(?i)(https?://\\S+|/([^/]\\S*)?)$" -}}
{{- range $key, $max := dict "title" 80 "message" 4000 "linkText" 60 "linkUrl" 500 "picture" 500 -}}
{{- if gt (len (get $b $key | default "" | toString)) (int $max) -}}
{{- fail (printf "banner.%s is too long (max %d characters)" $key (int $max)) -}}
{{- end -}}
{{- end -}}
{{- range $key := list "linkUrl" "picture" -}}
{{- if and (get $b $key) (not (regexMatch $safeUrl (get $b $key | toString))) -}}
{{- fail (printf "banner.%s must start with https://, http:// or /" $key) -}}
{{- end -}}
{{- end -}}
{{- if and $b.countdown (not (regexMatch "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?Z$" ($b.countdown | default "" | toString))) -}}
{{- fail (printf "banner.countdown must be a UTC time such as 2026-10-20T18:00:00Z, not %q" ($b.countdown | default "" | toString)) -}}
{{- end -}}
{{- $secs := $b.refreshSeconds -}}
{{- if not (and (or (kindIs "float64" $secs) (kindIs "int64" $secs) (kindIs "int" $secs)) (ge (int $secs) 15) (le (int $secs) 3600)) -}}
{{- fail "banner.refreshSeconds must be a number of seconds from 15 to 3600" -}}
{{- end -}}
# Chart defaults for the banner (from values.yaml), used until an admin publishes something.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-banner-content
  namespace: {{ include "coder-banner.namespace" . }}
  labels:
    {{- include "coder-banner.labels" . | nindent 4 }}
data:
  banner.json: |
    {{- dict
        "enabled" (include "coder-banner.bool" (list . "enabled") | eq "true")
        "id" (include "coder-banner.id" .)
        "level" (include "coder-banner.choice" (list . "level" "info"))
        "title" ($b.title | default "" | toString)
        "message" ($b.message | default "" | toString)
        "linkText" ($b.linkText | default "" | toString)
        "linkUrl" ($b.linkUrl | default "" | toString)
        "dismissible" (include "coder-banner.bool" (list . "dismissible") | eq "true")
        "showOnLoginPage" (include "coder-banner.bool" (list . "showOnLoginPage") | eq "true")
        "refreshSeconds" (int $b.refreshSeconds)
        "effect" (include "coder-banner.choice" (list . "effect" "none"))
        "repeat" (include "coder-banner.bool" (list . "repeat") | eq "true")
        "speed" (include "coder-banner.choice" (list . "speed" "normal"))
        "crawlSpeed" (include "coder-banner.number" (list . "crawlSpeed" 4 60 15) | int)
        "crawlTilt" (include "coder-banner.number" (list . "crawlTilt" 0 100 100) | int)
        "font" (include "coder-banner.choice" (list . "font" "default"))
        "align" (include "coder-banner.choice" (list . "align" "center"))
        "markdown" (include "coder-banner.bool" (list . "markdown") | eq "true")
        "picture" ($b.picture | default "" | toString)
        "pictureFit" (include "coder-banner.choice" (list . "pictureFit" "span"))
        "outline" (include "coder-banner.bool" (list . "outline") | eq "true")
        "countdown" ($b.countdown | default "" | toString)
        "receipts" (include "coder-banner.bool" (list . "receipts") | eq "true")
        "openEffect" (include "coder-banner.choice" (list . "openEffect" "none"))
        "closeEffect" (include "coder-banner.choice" (list . "closeEffect" "fade"))
      | toPrettyJson | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-banner-app
  namespace: {{ include "coder-banner.namespace" . }}
  labels:
    {{- include "coder-banner.labels" . | nindent 4 }}
data:
  {{- range $name := list "banner.js" "fx.css" "server.py" "live.py" "admin.html" "app.js" "app.css" "emoji-picker.js" }}
  {{ $name }}: |
    {{- $.Files.Get (printf "files/%s" $name) | nindent 4 }}
  {{- end }}
---
# Third-party code, kept apart from ours: the text-effects library (Anime.js, MIT). Served as-is, unmodified.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-banner-vendor
  namespace: {{ include "coder-banner.namespace" . }}
  labels:
    {{- include "coder-banner.labels" . | nindent 4 }}
data:
  {{- range $name := list "anime.umd.min.js" "LICENSE-animejs.md" }}
  {{ $name }}: |
    {{- $.Files.Get (printf "files/vendor/%s" $name) | nindent 4 }}
  {{- end }}
---
# The emoji list for the admin page's emoji picker: one generated script (build-emoji-data), in its own
# ConfigMap because of its size.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-banner-emoji
  namespace: {{ include "coder-banner.namespace" . }}
  labels:
    {{- include "coder-banner.labels" . | nindent 4 }}
data:
  {{- range $name := list "emoji-data.js" "LICENSE-emojibase.md" }}
  {{ $name }}: |
    {{- $.Files.Get (printf "files/emoji/%s" $name) | nindent 4 }}
  {{- end }}
---
# What an admin publishes from the admin page (state.json). Helm only owns the metadata: it never
# renders `data`, so a `helm upgrade` cannot overwrite a published banner.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-banner-state
  namespace: {{ include "coder-banner.namespace" . }}
  labels:
    {{- include "coder-banner.labels" . | nindent 4 }}
