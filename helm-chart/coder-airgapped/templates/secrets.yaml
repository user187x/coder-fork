{{- include "ca.values" . -}}
{{- $s := .Values.secrets }}
{{- if $s.initAuth.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.initAuth.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ca.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
stringData:
  email: {{ $s.initAuth.email | quote }}
  username: {{ $s.initAuth.username | quote }}
  password: {{ include "ca.secretValue" (list $s.initAuth.password . $s.initAuth.name "password") | quote }}
{{- end }}
{{- if $s.logsDb.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.logsDb.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ca.uiLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
stringData:
  password: {{ include "ca.secretValue" (list $s.logsDb.password . $s.logsDb.name "password") | quote }}
{{- end }}
{{- range $key, $cfg := dict "tlsCa" $s.tlsCa "oidcCa" $s.oidcCa }}
{{- if $cfg.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cfg.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ca.labels" $ | nindent 4 }}
type: Opaque
stringData:
  ca.crt: {{ required (printf "secrets.%s.caCrt is required when secrets.%s.create is true" $key $key) $cfg.caCrt | quote }}
{{- end }}
{{- end }}
{{- if $s.oidcClient.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.oidcClient.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ca.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ required "secrets.oidcClient.clientSecret is required" $s.oidcClient.clientSecret | quote }}
{{- end }}
{{- if $s.wildcardTls.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.wildcardTls.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ca.labels" . | nindent 4 }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ required "secrets.wildcardTls.tlsCrt is required" $s.wildcardTls.tlsCrt | quote }}
  tls.key: {{ required "secrets.wildcardTls.tlsKey is required" $s.wildcardTls.tlsKey | quote }}
{{- end }}
