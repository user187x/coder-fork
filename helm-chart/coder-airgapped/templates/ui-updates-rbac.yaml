{{- include "ca.values" . -}}
{{- if .Values.uiUpdates.enabled }}
{{- $ui := .Values.uiUpdates }}
{{- $ns := .Release.Namespace }}
{{- $s := .Values.secrets }}
{{- $db := .Values.database.name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-ui-updates
  namespace: {{ $ns }}
  labels:
    {{- include "ca.uiLabels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-ui-updates
  namespace: {{ $ns }}
  labels:
    {{- include "ca.uiLabels" . | nindent 4 }}
rules:
  # Keycloak view: repairs the CA and OIDC Secrets Coder reads.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $s.tlsCa.name }}, {{ $s.oidcClient.name }}, {{ $s.oidcCa.name }}]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $s.logsDb.name }}, {{ $db }}-app, {{ $db }}-ca]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  # Settings > Certificates overview.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $s.oidcCa.name }}, {{ $s.tlsCa.name }}, {{ $s.wildcardTls.name }}]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [coder]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [coder-platform-config]
    verbs: [get]
  # Persistence view (CloudNativePG backups).
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, create, patch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [backups, scheduledbackups]
    verbs: [get, list, create]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-ui-updates
  namespace: {{ $ns }}
  labels:
    {{- include "ca.uiLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-ui-updates
subjects:
  - {kind: ServiceAccount, name: coder-ui-updates, namespace: {{ $ns }}}
---
# Monitoring view: workspace pods and their logs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-ui-updates-workspaces
  namespace: {{ $ns }}
  labels:
    {{- include "ca.uiLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # Monitoring > Security posture: are workspaces segmented?
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-ui-updates-workspaces
  namespace: {{ $ns }}
  labels:
    {{- include "ca.uiLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-ui-updates-workspaces
subjects:
  - {kind: ServiceAccount, name: coder-ui-updates, namespace: {{ $ns }}}
---
# Network view (cluster map), Admin menu gauge, Persistence view.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coder-ui-updates-{{ $ns }}
  labels:
    {{- include "ca.uiLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotclasses]
    verbs: [get, list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [clusters.postgresql.cnpg.io]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coder-ui-updates-{{ $ns }}
  labels:
    {{- include "ca.uiLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: coder-ui-updates-{{ $ns }}
subjects:
  - {kind: ServiceAccount, name: coder-ui-updates, namespace: {{ $ns }}}
{{- if $ui.keycloak.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-ui-updates
  namespace: {{ $ui.keycloak.namespace }}
  labels:
    {{- include "ca.uiLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $ui.keycloak.adminSecret }}]
    verbs: [get]
  - apiGroups: [k8s.keycloak.org]
    resources: [keycloaks]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-ui-updates
  namespace: {{ $ui.keycloak.namespace }}
  labels:
    {{- include "ca.uiLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-ui-updates
subjects:
  - {kind: ServiceAccount, name: coder-ui-updates, namespace: {{ $ns }}}
{{- end }}
{{- if $ui.argocd.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-ui-updates
  namespace: {{ $ui.argocd.namespace }}
  labels:
    {{- include "ca.uiLabels" . | nindent 4 }}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [{{ $ui.argocd.app }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-ui-updates
  namespace: {{ $ui.argocd.namespace }}
  labels:
    {{- include "ca.uiLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-ui-updates
subjects:
  - {kind: ServiceAccount, name: coder-ui-updates, namespace: {{ $ns }}}
{{- end }}
{{- end }}
